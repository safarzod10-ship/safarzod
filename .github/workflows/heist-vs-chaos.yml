name: heist-vs-chaos
on:
  push:
    paths: ['heist-vs-chaos/**', '.github/workflows/heist-vs-chaos.yml']
    branches: ['**']
    tags: ['hvc-v*']
  pull_request:
    paths: ['heist-vs-chaos/**']
  workflow_dispatch:
concurrency:
  group: heist-vs-chaos-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    working-directory: heist-vs-chaos
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: heist-vs-chaos/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:levels
      - run: npm test
      - run: npm run build
      - run: npm run secrets:check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: heist-vs-chaos-dist
          path: heist-vs-chaos/dist
          retention-days: 14
  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: heist-vs-chaos
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/heist-vs-chaos:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/heist-vs-chaos:latest
            ghcr.io/${{ github.repository_owner }}/heist-vs-chaos:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run -d --name hvc -p 8080:8080 -e ADMIN_TOKEN=ci-token-0123456789abcdefghij -e SECRET_KEY=$(openssl rand -base64 32) ghcr.io/${{ github.repository_owner }}/heist-vs-chaos:${{ steps.v.outputs.version }}
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 2; done
          curl -fsS localhost:8080/healthz
          docker run --rm ghcr.io/${{ github.repository_owner }}/heist-vs-chaos:${{ steps.v.outputs.version }} install | bash -n
