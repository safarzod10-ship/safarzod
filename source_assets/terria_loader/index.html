<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TERRIA</title>
<link rel="preload" href="terria-logo.webp" as="image" crossorigin="anonymous">
<style>html,body{margin:0;height:100%;background:#000}</style>
</head>
<body>
<!-- Put this as early in <body> as possible so the loader shows on the first paint. -->
<script src="terria-loader.js" data-logo="terria-logo.webp"></script>

<script>
// Demo: fake progress. In the real page call TerriaLoader.set(p) / TerriaLoader.done() from your loading code.
(function(){
  var p = 0;
  (function step(){
    p += .03 + Math.random() * .08; TerriaLoader.set(p);
    if (p < 1) setTimeout(step, 250 + Math.random() * 500); else TerriaLoader.done();
  })();
  addEventListener('terria-loader-done', function(){ console.log('loader finished'); });
})();
</script>
</body>
</html>
