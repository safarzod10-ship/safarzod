# HEIST vs CHAOS - stack for a server that already runs Caddy on 80/443 (e.g. another project).
# The game joins that Caddy's Docker network; the installer adds one marked site block to its Caddyfile.
name: heist-vs-chaos
services:
  app:
    image: ${HVC_IMAGE:-ghcr.io/safarzod10-ship/heist-vs-chaos}:${HVC_VERSION:-latest}
    env_file: .env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, proxy]
    shm_size: "512m"
    mem_limit: 1800m
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  proxy:
    external: true
    name: ${HVC_PROXY_NETWORK:?proxy network}
