<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090D">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>CardArena</title>
<link rel="icon" href="assets/cardarena-avatar.png">
<style>
/* =====================================================================
   DESIGN TOKENS
   Palette derived from the brief; accent kept for state, not decoration.
   ===================================================================== */
:root {
  --bg: #09090D;
  --bg-deep: #050507;
  --surface: #15151D;
  --surface-2: #1D1D28;
  --surface-3: #252532;
  --border: #292935;
  --border-soft: #1F1F2A;
  --accent: #A855F7;
  --accent-active: #8B5CF6;
  --accent-soft: rgba(168, 85, 247, 0.14);
  --text: #F5F5F7;
  --text-2: #9696A6;
  --text-3: #6C6C7C;
  --success: #34C98A;
  --success-soft: rgba(52, 201, 138, 0.13);
  --warning: #F2B84B;
  --warning-soft: rgba(242, 184, 75, 0.13);
  --danger: #EF6B6B;
  --mythic: #E2B857;
  --legendary: #B9A3FF;

  --gutter: 20px;
  --radius: 18px;
  --radius-sm: 12px;
  --tabbar-h: 64px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --font: system-ui, -apple-system, "Roboto", "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Roboto Mono", "SFMono-Regular", "Menlo", "Consolas", monospace;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg-deep); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg-deep);
  color: var(--text);
  font: 400 15px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
img, svg { display: block; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* App frame: phone-only layout, centred on wide screens */
.app {
  position: relative;
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
  overflow-x: clip;
}
@media (min-width: 481px) {
  .app { box-shadow: 0 0 0 1px var(--border-soft); }
}

.page {
  padding: calc(var(--safe-top) + 8px) calc(var(--gutter) + var(--safe-right)) calc(var(--tabbar-h) + var(--safe-bottom) + 32px) calc(var(--gutter) + var(--safe-left));
}
.page.sub { padding-bottom: calc(var(--safe-bottom) + 112px); }
.section { margin-top: 28px; }
.section:first-child { margin-top: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.section-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.section-note { font-size: 12px; color: var(--text-3); }
.muted { color: var(--text-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }

/* ---------- Top bar (home / tabs) ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: calc(56px + var(--safe-top));
  padding: var(--safe-top) calc(var(--gutter) + var(--safe-right)) 0 calc(var(--gutter) + var(--safe-left));
  margin: calc(-8px - var(--safe-top)) calc(-1 * (var(--gutter) + var(--safe-right))) 0 calc(-1 * (var(--gutter) + var(--safe-left)));
  background: rgba(9, 9, 13, 0.94);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.topbar.scrolled { border-bottom-color: var(--border-soft); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-logo { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; flex: none; background: var(--surface-2); }
.brand-fallback {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
  background: var(--surface-2); border: 1px dashed var(--border); color: var(--text-3);
  font-size: 11px; font-weight: 600;
}
.brand-name { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex: none; }
.balance {
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 12px 0 8px; border-radius: 17px;
  background: var(--surface); border: 1px solid var(--border-soft);
  font-size: 14px; font-weight: 600;
}
.coin { width: 18px; height: 18px; flex: none; }
.page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }

/* ---------- Avatars ---------- */
.avatar {
  --size: 36px;
  width: var(--size); height: var(--size); flex: none;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: calc(var(--size) * 0.36); font-weight: 600; letter-spacing: 0.01em;
  color: #fff;
  background: var(--av, #3A3A4A);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  user-select: none;
}
.avatar.me { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent); }
.avatar-btn { border-radius: 50%; min-width: 44px; min-height: 44px; display: grid; place-items: center; }
.avatar-stack { display: flex; }
.avatar-stack .avatar { --size: 24px; margin-left: -7px; box-shadow: 0 0 0 2px var(--surface); font-size: 9px; }
.avatar-stack .avatar:first-child { margin-left: 0; }

/* ---------- Chips / badges ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px; border-radius: 6px;
  font-size: 12px; font-weight: 500; white-space: nowrap;
  background: var(--surface-2); color: var(--text-2);
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.live { color: var(--success); background: var(--success-soft); }
.chip.drawing { color: var(--warning); background: var(--warning-soft); }
.chip.done { color: var(--text-2); }
.chip.cancelled { color: var(--danger); background: rgba(239,107,107,.12); }
.chip.scheduled { color: var(--legendary); background: var(--accent-soft); }
.tag-demo {
  display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px;
  font-size: 11px; font-weight: 500; line-height: 16px; vertical-align: 1px;
  color: var(--text-3); border: 1px solid var(--border);
}
.tag-me { color: var(--accent); border-color: rgba(168,85,247,.45); }
.rarity { font-weight: 500; }
.rarity.mythic { color: var(--mythic); }
.rarity.legendary { color: var(--legendary); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 52px; padding: 0 22px; border-radius: 14px;
  font-size: 16px; font-weight: 600; letter-spacing: -0.005em;
  transition: transform .12s, background-color .2s, opacity .2s;
  user-select: none;
}
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn-block { width: 100%; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active:not(:disabled) { background: var(--accent-active); }
.btn-primary:disabled { background: var(--surface-2); color: var(--text-2); }
.btn-primary.joined:disabled { background: var(--success-soft); color: var(--success); }
.btn-secondary { background: var(--surface-2); color: var(--text); }
.btn-ghost { color: var(--text-2); height: 44px; padding: 0 14px; font-weight: 500; font-size: 15px; }
.btn-small { height: 40px; padding: 0 16px; border-radius: 11px; font-size: 14px; font-weight: 600; }
.btn-danger { background: rgba(239,107,107,.12); color: var(--danger); }
.btn svg { width: 18px; height: 18px; }

.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Home ---------- */
.greeting { margin-top: 18px; }
.greeting .hello { font-size: 14px; color: var(--text-2); }
.greeting h1 { margin-top: 2px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }

.auction-list { display: grid; gap: 14px; margin-top: 18px; }
.auction-tile {
  position: relative;
  display: grid; grid-template-columns: 92px 1fr; gap: 16px;
  padding: 14px; border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border-soft);
  text-align: left; width: 100%;
  transition: transform .15s var(--ease-out), border-color .2s;
}
.auction-tile:active { transform: scale(0.985); }
.auction-tile.urgent { border-color: rgba(242,184,75,.28); }
.auction-thumb { width: 92px; aspect-ratio: 5 / 7; border-radius: 9px; overflow: hidden; background: #000; }
.auction-thumb svg { width: 100%; height: 100%; }
.auction-info { display: flex; flex-direction: column; min-width: 0; }
.auction-info .name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.auction-info .meta { margin-top: 2px; font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.auction-info .status-row { margin-top: 10px; }
.auction-info .live-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 12px; }
.mini-timer { font-size: 20px; font-weight: 600; color: var(--text); transition: color .3s; }
.mini-timer.urgent { color: var(--warning); }
.people { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.people .icon { width: 17px; height: 17px; }
.open-hint { display: inline-flex; align-items: center; gap: 2px; margin-top: 12px; height: 36px; padding: 0 12px 0 14px; border-radius: 10px; background: var(--surface-2); font-size: 14px; font-weight: 600; align-self: flex-start; }
.open-hint .icon { width: 16px; height: 16px; }
.winner-line { margin-top: auto; padding-top: 12px; font-size: 14px; color: var(--text-2); }
.winner-line b { color: var(--text); font-weight: 600; }
.winner-line.me b { color: var(--success); }
.empty-note {
  margin-top: 18px; padding: 18px; border-radius: var(--radius);
  border: 1px dashed var(--border); color: var(--text-2); font-size: 14px;
}
.demo-footnote { margin-top: 28px; font-size: 12px; color: var(--text-3); line-height: 1.5; }

/* ---------- Sub-screen header ---------- */
.subbar {
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px;
  height: calc(56px + var(--safe-top));
  padding: var(--safe-top) calc(var(--gutter) + var(--safe-right) - 6px) 0 calc(var(--gutter) + var(--safe-left) - 10px);
  margin: calc(-8px - var(--safe-top)) calc(-1 * (var(--gutter) + var(--safe-right))) 0 calc(-1 * (var(--gutter) + var(--safe-left)));
  background: rgba(9, 9, 13, 0.94);
}
.icon-btn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--text); }
.icon-btn:active { background: var(--surface); }
.subbar-title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Card stage (auction / detail) ---------- */
.card-stage { display: flex; justify-content: center; margin-top: 14px; perspective: 900px; }
.card-art {
  position: relative;
  width: min(62vw, 252px);
  aspect-ratio: 5 / 7;
  border-radius: 14px;
  transform-style: preserve-3d;
  will-change: transform;
  box-shadow: 0 18px 40px -18px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,0.04);
  touch-action: pan-y;
}
.card-art svg { width: 100%; height: 100%; border-radius: 14px; }
.card-art .sheen {
  position: absolute; inset: 0; border-radius: 14px; overflow: hidden; pointer-events: none;
}
.card-art .sheen::before {
  content: ""; position: absolute; top: -10%; bottom: -10%; width: 45%; left: -60%;
  background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0) 20%, rgba(255,240,210,.16) 50%, rgba(255,255,255,0) 80%, transparent 100%);
  transform: skewX(-12deg);
  opacity: 0;
}
.card-art.enter { animation: cardIn .62s var(--ease-out) both; }
.card-art.enter .sheen::before { animation: sheen 1.15s .35s ease-in-out both; }
.card-art.mythic { box-shadow: 0 22px 46px -20px rgba(0,0,0,.95), 0 0 0 1px rgba(226,184,87,.18), 0 0 38px -12px rgba(168,85,247,.35); }
.card-art.legendary { box-shadow: 0 22px 46px -20px rgba(0,0,0,.95), 0 0 0 1px rgba(185,163,255,.18), 0 0 38px -12px rgba(120,140,255,.32); }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(14px) scale(.86) rotateX(9deg); }
  to   { opacity: 1; transform: none; }
}
@keyframes sheen {
  0%   { opacity: 0; left: -60%; }
  20%  { opacity: 1; }
  100% { opacity: 0; left: 120%; }
}
.fade-up { animation: fadeUp .45s var(--ease-out) both; }
.fade-up.d1 { animation-delay: .18s; } .fade-up.d2 { animation-delay: .26s; } .fade-up.d3 { animation-delay: .34s; } .fade-up.d4 { animation-delay: .42s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.card-facts {
  display: grid; grid-template-columns: repeat(3, 1fr);
  margin-top: 22px; padding: 14px 4px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border-soft);
}
.card-facts > div { text-align: center; padding: 0 6px; min-width: 0; }
.card-facts > div + div { border-left: 1px solid var(--border); }
.fact-label { font-size: 12px; color: var(--text-3); }
.fact-value { margin-top: 2px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.timer-block { margin-top: 16px; padding: 18px 20px 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border-soft); }
.timer-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.timer-label { font-size: 13px; color: var(--text-2); }
.timer-value { margin-top: 6px; font-size: 44px; line-height: 1.05; font-weight: 600; transition: color .35s; }
.timer-block.urgent .timer-value { color: var(--warning); }
.progress { margin-top: 14px; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.progress > i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left center; transition: background-color .35s; }
.timer-block.urgent .progress > i { background: var(--warning); }
.round-code { font-size: 12px; color: var(--text-3); }

.participants { margin-top: 28px; }
.p-list { margin-top: 4px; }
.p-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); }
.p-row:last-child { border-bottom: 0; }
.p-row .p-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-row .p-sub { font-size: 12px; color: var(--text-3); font-weight: 400; }
.p-chance { font-size: 15px; font-weight: 600; color: var(--text-2); }
.p-row.me .p-chance { color: var(--accent); }
.p-row.enter { animation: fadeUp .4s var(--ease-out) both; }
.p-row.winner .p-chance { color: var(--success); }

.cta-bar {
  position: fixed; z-index: 30; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  padding: 14px calc(var(--gutter) + var(--safe-right)) calc(14px + var(--safe-bottom)) calc(var(--gutter) + var(--safe-left));
  background: linear-gradient(to top, var(--bg) 70%, rgba(9,9,13,0));
}
.cta-note { margin-top: 8px; text-align: center; font-size: 12px; color: var(--text-3); }

/* ---------- Tab bar ---------- */
.tabbar {
  position: fixed; z-index: 40; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  padding: 0 var(--safe-right) var(--safe-bottom) var(--safe-left);
  background: rgba(13, 13, 18, 0.97);
  border-top: 1px solid var(--border-soft);
}
.tabbar[hidden] { display: none; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-3); font-size: 11px; font-weight: 500; min-height: 44px; transition: color .2s; }
.tab .icon { width: 24px; height: 24px; }
.tab.active { color: var(--accent); }
.tab:active .icon { transform: scale(.92); }

/* ---------- Collection ---------- */
.collection-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 18px; }
.coll-item { text-align: left; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border-soft); padding: 10px 10px 14px; transition: transform .15s var(--ease-out); }
.coll-item:active { transform: scale(.98); }
.coll-item .thumb { aspect-ratio: 5/7; border-radius: 10px; overflow: hidden; background: #000; }
.coll-item .thumb svg { width: 100%; height: 100%; }
.coll-item .name { margin-top: 10px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
.coll-item .meta { font-size: 12px; color: var(--text-2); padding: 0 2px; }
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 48px 12px 0; }
.empty-state svg.illu { width: 148px; height: 120px; }
.empty-state h2 { margin-top: 22px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.empty-state p { margin-top: 8px; max-width: 280px; font-size: 14px; color: var(--text-2); }
.empty-state .btn { margin-top: 24px; }

.timeline { margin-top: 6px; padding-left: 4px; }
.tl-item { position: relative; padding: 0 0 18px 22px; }
.tl-item::before { content: ""; position: absolute; left: 4px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); box-shadow: 0 0 0 3px var(--bg); }
.tl-item::after { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 1px; background: var(--border); }
.tl-item:last-child { padding-bottom: 0; }
.tl-item:last-child::after { display: none; }
.tl-item.hl::before { background: var(--accent); }
.tl-text { font-size: 14px; }
.tl-time { font-size: 12px; color: var(--text-3); }

/* ---------- Generic list surface ---------- */
.list { border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border-soft); overflow: hidden; }
.list-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; width: 100%; text-align: left; }
.list-row + .list-row { border-top: 1px solid var(--border-soft); }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .sub { font-size: 12px; color: var(--text-3); }
.list-row .end { font-size: 14px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.list-row .end.win { color: var(--success); }
.list-row .end.plus { color: var(--success); }
.list-row > .icon { color: var(--text-2); }
button.list-row:active { background: var(--surface-2); }

/* ---------- Rating ---------- */
.my-rank { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 16px; border-radius: var(--radius); background: var(--accent-soft); border: 1px solid rgba(168,85,247,.25); }
.my-rank .pos { font-size: 26px; font-weight: 600; min-width: 40px; color: var(--accent); }
.rank-row .pos { width: 26px; font-size: 14px; font-weight: 600; color: var(--text-3); text-align: center; }
.rank-row .pos.top { color: var(--mythic); }
.rank-row .avatar { --size: 32px; }
.rank-row .count { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 50px; font-size: 15px; font-weight: 600; }
.rank-row .count .icon { width: 16px; height: 16px; color: var(--text-3); }
.rank-row.is-me { background: rgba(168,85,247,.07); }

/* ---------- Profile ---------- */
.profile-head { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
.profile-head .avatar { --size: 64px; }
.profile-head .name { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; padding: 16px 4px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border-soft); }
.stats > div { text-align: center; }
.stats > div + div { border-left: 1px solid var(--border); }
.stats .v { font-size: 22px; font-weight: 600; }
.stats .l { font-size: 12px; color: var(--text-3); }

@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetIn { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }

.banner { position: relative; z-index: 50; padding: calc(var(--safe-top) + 10px) var(--gutter) 10px; background: var(--warning-soft); color: var(--warning); font-size: 13px; text-align: center; }

  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }

  .brand-name { font-size: 16px; }

/* =====================================================================
   STORAGE MANAGER — the only place that touches localStorage.
   Falls back to in-memory storage when localStorage is unavailable.
   ===================================================================== */
const StorageManager = (() => {
  const memory = new Map();
  let persistent = false;
  try {
    const probe = '__cardarena_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    persistent = true;
  } catch (e) { persistent = false; }

  return {
    isPersistent: () => persistent,
    read(key) {
      if (persistent) {
        try { return window.localStorage.getItem(key); } catch (e) { persistent = false; }
      }
      return memory.has(key) ? memory.get(key) : null;
    },
    write(key, value) {
      memory.set(key, value);
      if (!persistent) return false;
      try { window.localStorage.setItem(key, value); return true; }
      catch (e) { persistent = false; return false; }
    },
    remove(key) {
      memory.delete(key);
      if (persistent) { try { window.localStorage.removeItem(key); } catch (e) { /* ignore */ } }
    },
  };
})();

/* =====================================================================
   CARD MANAGER — catalog and ownership rules (each card exists once)
   ===================================================================== */
const CardManager = (() => {
  const CATALOG = Object.freeze({
    '1111': Object.freeze({ id: '1111', name: 'Golden Dragon', rarity: 'Mythic', rarityKey: 'mythic', edition: '1/1', theme: 'Золотой дракон' }),
    '2026': Object.freeze({ id: '2026', name: 'Shadow Wolf', rarity: 'Legendary', rarityKey: 'legendary', edition: '1/1', theme: 'Теневой волк' }),
  });

  return {
    CATALOG,
    ids: () => Object.keys(CATALOG),
    get: (id) => CATALOG[id] || null,

    createInitialOwnership() {
      const cards = {};
      for (const id of Object.keys(CATALOG)) cards[id] = { id, ownerId: null, acquiredAt: null, roundId: null, history: [] };
      return cards;
    },

    /**
     * Assigns a unique card to its round winner. Idempotent for the same
     * round; refuses to re-assign a card that already has an owner, which
     * is what keeps a 1/1 card from ever being granted twice.
     */
    transfer(state, cardId, winner, round, at) {
      const card = state.cards[cardId];
      if (!card) return false;
      if (card.ownerId) return card.roundId === round.id && card.ownerId === winner.id;
      card.ownerId = winner.id;
      card.acquiredAt = at;
      card.roundId = round.id;
      card.history.push({ at, text: 'Передана победителю раунда ' + round.id + ': ' + (winner.id === CONFIG.USER_ID ? 'вам' : winner.name) });
      return true;
    },

    ownedBy(state, ownerId) {
      return Object.values(state.cards).filter(c => c.ownerId === ownerId).sort((a, b) => (b.acquiredAt || 0) - (a.acquiredAt || 0));
    },

    countOwnedBy(state, ownerId) {
      return Object.values(state.cards).filter(c => c.ownerId === ownerId).length;
    },
  };
})();

/* =====================================================================
   AUCTION MANAGER — round lifecycle and the draw
   Statuses: Scheduled → Active → Drawing → Completed
             Scheduled/Active/Drawing → Cancelled
   ===================================================================== */
const AuctionManager = (() => {
  const STATUS = Object.freeze({ SCHEDULED: 'Scheduled', ACTIVE: 'Active', DRAWING: 'Drawing', COMPLETED: 'Completed', CANCELLED: 'Cancelled' });
  const TRANSITIONS = Object.freeze({
    Scheduled: ['Active', 'Cancelled'],
    Active: ['Drawing', 'Cancelled'],
    Drawing: ['Completed', 'Cancelled'],
    Completed: [],
    Cancelled: [],
  });
  // Demo opponents and the offset (ms after round start) at which each joins.
  const DEMO_LINEUPS = {
    '1111': [['bot:alex', 0], ['bot:timur', 4000], ['bot:samir', 9000]],
    '2026': [['bot:samir', 0], ['bot:timur', 6000]],
  };

  function transition(round, to, at) {
    if (!TRANSITIONS[round.status] || TRANSITIONS[round.status].indexOf(to) === -1) {
      throw new Error('Illegal round transition ' + round.status + ' → ' + to + ' (' + round.id + ')');
    }
    round.status = to;
    round.statusLog.push({ status: to, at });
  }

  function buildRound(cardId, startAt) {
    const lineup = DEMO_LINEUPS[cardId] || [];
    return {
      id: Utils.secureId('R'),
      cardId,
      status: STATUS.ACTIVE,
      statusLog: [{ status: STATUS.ACTIVE, at: startAt }],
      createdAt: startAt,
      startAt,
      endAt: startAt + CONFIG.ROUND_MS, // absolute end time: survives reloads
      closedAt: null,
      participants: lineup.map(([id, offset]) => ({ id, name: People.get(id).name, isBot: true, joinedAt: startAt + offset })),
      result: null,
    };
  }

  function visibleParticipants(round, now) {
    if (round.status !== STATUS.ACTIVE && round.status !== STATUS.SCHEDULED) return round.participants.slice();
    return round.participants.filter(p => p.joinedAt <= now).sort((a, b) => a.joinedAt - b.joinedAt);
  }

  function isUserIn(round) { return round.participants.some(p => p.id === CONFIG.USER_ID); }

  /** Step 1–3: close registration, freeze the list. Active → Drawing. */
  function closeRegistration(round, now) {
    transition(round, STATUS.DRAWING, now);
    round.closedAt = now;
    round.participants = round.participants.filter(p => p.joinedAt <= round.endAt).sort((a, b) => a.joinedAt - b.joinedAt);
  }

  /**
   * Step 3–5: validate and pick the winner with crypto.getRandomValues.
   * Equal probability for every frozen participant. The result is stored
   * before any animation runs; the roulette only visualises it.
   */
  function drawWinner(state, round, now) {
    if (round.status !== STATUS.DRAWING || round.result) return;
    const order = round.participants.map(p => p.id);
    if (order.length < CONFIG.MIN_PARTICIPANTS) {
      transition(round, STATUS.CANCELLED, now);
      round.result = { cancelled: true, reason: 'Недостаточно участников', order, drawnAt: now, revealed: false };
      return;
    }
    const winnerIndex = Utils.secureRandomInt(order.length);
    const winner = round.participants[winnerIndex];
    round.result = { cancelled: false, order, winnerIndex, winnerId: winner.id, drawnAt: now, chance: 100 / order.length, revealed: false };
    CardManager.transfer(state, round.cardId, winner, round, now);
    transition(round, STATUS.COMPLETED, now);
  }

  return {
    STATUS,
    createInitialRounds(now) { return CardManager.ids().map(id => buildRound(id, now)); },
    visibleParticipants,
    isUserIn,
    getRound: (state, id) => state.rounds.find(r => r.id === id) || null,
    winChance(round, now) {
      const n = visibleParticipants(round, now).length;
      return n ? 100 / n : 0;
    },
    remaining(round, now) { return Math.max(0, round.endAt - now); },
    isOpen(round, now) { return round.status === STATUS.ACTIVE && now < round.endAt; },

    /** Registers the current user once. Returns a status string for the UI. */
    join(roundId) {
      let outcome = 'error';
      StateManager.update((state) => {
        const now = Utils.now();
        const round = state.rounds.find(r => r.id === roundId);
        if (!round) { outcome = 'missing'; return false; }
        if (!(round.status === STATUS.ACTIVE && now < round.endAt)) { outcome = 'closed'; return false; }
        if (isUserIn(round)) { outcome = 'already'; return false; }
        round.participants.push({ id: CONFIG.USER_ID, name: state.profile.name, isBot: false, joinedAt: now });
        outcome = 'joined';
        return true;
      });
      return outcome;
    },

    /**
     * Advances all rounds according to the clock. Safe to call any number
     * of times (on every tick, on load, on visibility change): each step
     * checks the current status first, so a result is produced exactly once.
     * Returns ids of rounds that reached a final state during this call.
     */
    tick(now) {
      const state = StateManager.get();
      const due = state.rounds.some(r =>
        (r.status === STATUS.SCHEDULED && now >= r.startAt) ||
        (r.status === STATUS.ACTIVE && now >= r.endAt) ||
        (r.status === STATUS.DRAWING));
      if (!due) return [];
      const finished = [];
      // Phase A: Scheduled → Active, Active → Drawing (persisted on its own)
      StateManager.update((s) => {
        let changed = false;
        for (const r of s.rounds) {
          if (r.status === STATUS.SCHEDULED && now >= r.startAt) { transition(r, STATUS.ACTIVE, now); changed = true; }
          if (r.status === STATUS.ACTIVE && now >= r.endAt) { closeRegistration(r, now); changed = true; }
        }
        return changed;
      });
      // Phase B: Drawing → Completed/Cancelled. If the page dies between A and B,
      // the next load finds the round in Drawing and finishes it here.
      StateManager.update((s) => {
        let changed = false;
        for (const r of s.rounds) {
          if (r.status === STATUS.DRAWING && !r.result) { drawWinner(s, r, now); finished.push(r.id); changed = true; }
        }
        return changed;
      });
      return finished;
    },

    markRevealed(roundId) {
      StateManager.update((s) => {
        const r = s.rounds.find(x => x.id === roundId);
        if (!r || !r.result || r.result.revealed) return false;
        r.result.revealed = true;
        return true;
      });
    },

    /** Finished rounds the user took part in whose result has not been shown yet. */
    pendingReveals(state) {
      return state.rounds.filter(r => r.result && !r.result.revealed && isUserIn(r));
    },
  };
})();

/* =====================================================================
   STATE MANAGER — load, validate, migrate, persist, notify
   ===================================================================== */
const StateManager = (() => {
  let state = null;
  const listeners = new Set();
  let recoveredFromCorruption = false;

  function createDefault(now, keepSettings) {
    return {
      version: CONFIG.SCHEMA_VERSION,
      rev: 0,
      createdAt: now,
      profile: { id: CONFIG.USER_ID, name: 'Demo Player' },
      balance: CONFIG.START_BALANCE,
      ledger: [{ id: Utils.secureId('TX'), at: now, amount: CONFIG.START_BALANCE, label: 'Начисление тестового баланса' }],
      settings: keepSettings ? { ...keepSettings } : { sound: true, motion: 'full' },
      cards: CardManager.createInitialOwnership(),
      rounds: AuctionManager.createInitialRounds(now),
    };
  }

  /* Migrations keyed by the version they upgrade FROM. */
  const MIGRATIONS = {
    // 0 = unversioned pre-release prototype data
    0: (s) => { s.version = 1; s.settings = s.settings || { sound: true, motion: 'full' }; s.rev = s.rev || 0; return s; },
  };
  function migrate(raw) {
    let s = raw;
    let v = Number.isInteger(s.version) ? s.version : 0;
    if (v > CONFIG.SCHEMA_VERSION) throw new Error('Data from a newer version');
    while (v < CONFIG.SCHEMA_VERSION) {
      if (!MIGRATIONS[v]) throw new Error('No migration from v' + v);
      s = MIGRATIONS[v](s);
      v = s.version;
    }
    return s;
  }

  function validate(s) {
    const statuses = Object.values(AuctionManager.STATUS);
    const isNum = Number.isFinite;
    if (!s || typeof s !== 'object') return false;
    if (s.version !== CONFIG.SCHEMA_VERSION || !isNum(s.rev)) return false;
    if (!s.profile || typeof s.profile.name !== 'string') return false;
    if (!isNum(s.balance) || !Array.isArray(s.ledger)) return false;
    if (!s.settings || typeof s.settings.sound !== 'boolean' || ['full', 'reduced'].indexOf(s.settings.motion) === -1) return false;
    if (!s.cards || typeof s.cards !== 'object') return false;
    for (const id of CardManager.ids()) {
      const c = s.cards[id];
      if (!c || c.id !== id || !Array.isArray(c.history)) return false;
    }
    if (!Array.isArray(s.rounds)) return false;
    const seen = new Set();
    for (const r of s.rounds) {
      if (!r || typeof r.id !== 'string' || seen.has(r.id)) return false;
      seen.add(r.id);
      if (!CardManager.get(r.cardId) || statuses.indexOf(r.status) === -1) return false;
      if (!isNum(r.startAt) || !isNum(r.endAt) || !Array.isArray(r.participants) || !Array.isArray(r.statusLog)) return false;
      const ids = r.participants.map(p => p && p.id);
      if (new Set(ids).size !== ids.length) return false; // duplicate registration
      if (r.status === 'Completed' && (!r.result || typeof r.result.winnerId !== 'string')) return false;
    }
    // Ownership must agree with completed rounds (no card held without a win)
    for (const id of CardManager.ids()) {
      const c = s.cards[id];
      if (c.ownerId) {
        const r = s.rounds.find(x => x.id === c.roundId);
        if (!r || !r.result || r.result.winnerId !== c.ownerId || r.cardId !== id) return false;
      }
    }
    return true;
  }

  function parse(raw) {
    if (!raw) return null;
    const obj = JSON.parse(raw);
    const migrated = migrate(obj);
    return validate(migrated) ? migrated : (() => { throw new Error('Invalid state'); })();
  }

  function persist() { StorageManager.write(CONFIG.STORAGE_KEY, JSON.stringify(state)); }

  /** Adopt a newer revision written by another tab before mutating. */
  function syncFromStorage() {
    try {
      const fresh = parse(StorageManager.read(CONFIG.STORAGE_KEY));
      if (fresh && fresh.rev > state.rev) { state = fresh; return true; }
    } catch (e) { /* keep in-memory state */ }
    return false;
  }

  function emit(reason) { listeners.forEach(fn => { try { fn(reason); } catch (e) { console.error(e); } }); }

  return {
    load() {
      const raw = StorageManager.read(CONFIG.STORAGE_KEY);
      try {
        state = parse(raw);
      } catch (e) {
        console.warn('[CardArena] Stored data unreadable, recreating demo.', e);
        // Keep the broken payload for inspection instead of silently losing it.
        if (raw) StorageManager.write(CONFIG.STORAGE_KEY + '.corrupt', raw);
        recoveredFromCorruption = true;
        state = null;
      }
      if (!state) { state = createDefault(Utils.now()); persist(); }
      return state;
    },
    wasRecovered: () => recoveredFromCorruption,
    get: () => state,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    /** Central mutation entry point. `fn` returns false to signal "no change". */
    update(fn, reason) {
      syncFromStorage();
      const before = state.rev;
      const changed = fn(state);
      if (changed === false) return false;
      state.rev = before + 1;
      persist();
      emit(reason || 'update');
      return true;
    },

    reset() {
      const settings = state ? state.settings : null;
      const nextRev = state ? state.rev + 1 : 0;
      state = createDefault(Utils.now(), settings);
      state.rev = nextRev;
      persist();
      emit('reset');
    },

    /**
     * Another tab changed storage. Adopt it when it is the same or a newer
     * revision: if two tabs drew at the same moment, every tab converges on
     * the last write instead of keeping its own diverging copy. (Without a
     * server there is no true arbitration — this only keeps tabs consistent.)
     */
    handleExternalChange() {
      try {
        const raw = StorageManager.read(CONFIG.STORAGE_KEY);
        const fresh = parse(raw);
        if (fresh && fresh.rev >= state.rev && raw !== JSON.stringify(state)) { state = fresh; emit('external'); }
      } catch (e) { /* ignore unreadable foreign writes; ours stays authoritative */ }
    },
    validate,
  };
})();

/* =====================================================================
   PROFILE MANAGER — derived stats, history, achievements, settings
   ===================================================================== */
const ProfileManager = {
  stats(state) {
    const joined = state.rounds.filter(AuctionManager.isUserIn);
    const wins = joined.filter(r => r.result && r.result.winnerId === CONFIG.USER_ID);
    return { participations: joined.length, wins: wins.length, cards: CardManager.countOwnedBy(state, CONFIG.USER_ID) };
  },

  drawHistory(state) {
    return state.rounds.filter(AuctionManager.isUserIn).map((r) => {
      const card = CardManager.get(r.cardId);
      const me = r.participants.find(p => p.id === CONFIG.USER_ID);
      let outcome, kind = '';
      if (r.status === 'Completed') {
        if (r.result.winnerId === CONFIG.USER_ID) { outcome = 'Победа'; kind = 'win'; }
        else outcome = 'Победил ' + People.displayName(state, r.result.winnerId);
      } else if (r.status === 'Cancelled') outcome = 'Отменён';
      else outcome = 'Идёт';
      return { roundId: r.id, title: card.name + ' #' + card.id, at: me.joinedAt, outcome, kind };
    }).sort((a, b) => b.at - a.at);
  },

  achievements(state) {
    const st = this.stats(state);
    const finishedJoined = state.rounds.filter(r => AuctionManager.isUserIn(r) && r.result).length;
    return [
      { key: 'first_join', icon: 'flag', title: 'Первое участие', desc: 'Зарегистрируйтесь в любом розыгрыше', done: st.participations >= 1 },
      { key: 'first_win', icon: 'crown', title: 'Первая победа', desc: 'Выиграйте уникальную карточку', done: st.wins >= 1 },
      { key: 'full_round', icon: 'clock', title: 'До конца', desc: 'Дождитесь итогов обоих розыгрышей с вашим участием', done: finishedJoined >= CardManager.ids().length },
      { key: 'collector', icon: 'layers', title: 'Коллекционер', desc: 'Соберите обе демо-карточки', done: st.cards >= CardManager.ids().length },
    ];
  },

  leaderboard(state) {
    const rows = People.LEADERBOARD_BASE.map(([id, base]) => ({ id, name: People.get(id).name, cards: base + CardManager.countOwnedBy(state, id), isMe: false }));
    rows.push({ id: CONFIG.USER_ID, name: state.profile.name, cards: CardManager.countOwnedBy(state, CONFIG.USER_ID), isMe: true });
    // Ties: the earlier (demo) entry keeps the higher place.
    rows.sort((a, b) => b.cards - a.cards || (a.isMe ? 1 : 0) - (b.isMe ? 1 : 0));
    rows.forEach((r, i) => { r.position = i + 1; });
    return rows;
  },

  setSetting(key, value) {
    StateManager.update((s) => {
      if (s.settings[key] === value) return false;
      s.settings[key] = value;
      return true;
    }, 'settings');
  },
};

/* =====================================================================
   MOTION + SOUND
   ===================================================================== */
const Motion = {
  mq: window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null,
  reduced() {
    const s = StateManager.get();
    return (s && s.settings.motion === 'reduced') || !!(this.mq && this.mq.matches);
  },
  apply() { document.documentElement.classList.toggle('reduce-motion', this.reduced()); },
};

const SoundManager = (() => {
  let ctx = null;
  let lastTick = 0;
  function enabled() { const s = StateManager.get(); return !!(s && s.settings.sound); }
  function context() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function blip(freq, dur, gain, delay) {
    const c = context(); if (!c) return;
    const t = c.currentTime + (delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = 'triangle'; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  return {
    unlock() { if (enabled()) context(); },
    tick() {
      if (!enabled()) return;
      const n = performance.now();
      if (n - lastTick < 45) return;
      lastTick = n;
      blip(1500, 0.035, 0.035);
    },
    tap() { if (enabled()) blip(900, 0.05, 0.03); },
    win() { if (!enabled()) return; [523, 659, 784, 1046].forEach((f, i) => blip(f, 0.32, 0.05, i * 0.09)); },
    lose() { if (enabled()) { blip(440, 0.22, 0.04); blip(330, 0.3, 0.035, 0.12); } },
  };
})();

/* =====================================================================
   ROULETTE CONTROLLER — purely visual.
   Receives an already-decided winnerIndex and only animates toward it.
   ===================================================================== */
const RouletteController = {
  /**
   * @param host       element with class .roulette (viewport)
   * @param tiles      array of tile elements, one per participant (in result.order)
   * @param winnerIndex index into `tiles`
   * @returns {skip(): void}
   */
  play({ host, makeTile, count, winnerIndex, duration, onDone }) {
    const strip = h('div', { class: 'roulette-strip' });
    // Enough cycles that the strip visibly travels ~35–45 tiles.
    const cycles = Math.max(6, Math.ceil(44 / count));
    const targetCycle = cycles - 2;
    const total = cycles * count;
    const tiles = [];
    for (let i = 0; i < total; i++) { const t = makeTile(i % count); tiles.push(t); strip.appendChild(t); }
    host.appendChild(strip);

    const targetIndex = targetCycle * count + winnerIndex;
    const tileWidth = tiles[0].offsetWidth;
    const pitch = tiles[1] ? tiles[1].offsetLeft - tiles[0].offsetLeft : tileWidth + 10;
    const center = host.clientWidth / 2;
    // Cosmetic landing offset inside the winner tile (never beyond ±32% of its
    // width, so the pointer always stays on the predetermined tile).
    const jitter = (Utils.secureRandomFloat() * 2 - 1) * tileWidth * 0.32;
    const startX = center - (count * pitch + tileWidth / 2);
    const endX = center - (targetIndex * pitch + tileWidth / 2) + jitter;
    const finalX = center - (targetIndex * pitch + tileWidth / 2);

    let raf = 0, start = 0, done = false, lastIdx = -1;
    const ease = (t) => 1 - Math.pow(1 - t, 4); // easeOutQuart: long, smooth deceleration
    const setX = (x) => { strip.style.transform = 'translate3d(' + x.toFixed(2) + 'px,0,0)'; };

    function finish() {
      if (done) return;
      done = true;
      cancelAnimationFrame(raf);
      // Settle exactly on the winner tile centre.
      strip.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1)';
      setX(finalX);
      tiles[targetIndex].classList.add('is-winner');
      setTimeout(onDone, 380);
    }
    function frame(ts) {
      if (!start) start = ts;
      const t = Math.min(1, (ts - start) / duration);
      const x = startX + (endX - startX) * ease(t);
      setX(x);
      const idx = Math.floor((center - x) / pitch);
      if (idx !== lastIdx) { lastIdx = idx; SoundManager.tick(); }
      if (t < 1) raf = requestAnimationFrame(frame);
      else finish();
    }
    setX(startX);
    raf = requestAnimationFrame(frame);
    return { skip: finish };
  },
};

/* =====================================================================
   NAVIGATION CONTROLLER — hash routes, Android back via history
   ===================================================================== */
const NavigationController = (() => {
  const TABS = ['home', 'collection', 'rating', 'profile'];
  function parse(hash) {
    const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    const name = parts[0] || 'home';
    const known = ['home', 'collection', 'rating', 'profile', 'auction', 'card', 'result'];
    if (known.indexOf(name) === -1) return { name: 'home', param: null };
    return { name, param: parts[1] || null };
  }
  return {
    TABS,
    current: () => parse(location.hash),
    isTab: (name) => TABS.indexOf(name) !== -1,
    /**
     * Push = sub-screen opened from inside the app (Android back returns).
     * Replace = tab switch / redirect (does not grow the back stack).
     */
    go(path, opts) {
      const target = '#/' + path;
      if (opts && opts.replace) history.replaceState(history.state, '', target);
      else if (location.hash !== target) history.pushState({ inApp: true }, '', target);
      UI.render();
    },
    back(fallback) {
      if (history.state && history.state.inApp) history.back();
      else this.go(fallback || 'home', { replace: true });
    },
  };
})();

/* =====================================================================
   REVEAL QUEUE — opens the result screen for finished rounds
   ===================================================================== */
const RevealQueue = {
  /** Open the next unseen result if no result screen is open. */
  next(fallbackPath) {
    const pending = AuctionManager.pendingReveals(StateManager.get());
    if (pending.length) { NavigationController.go('result/' + pending[0].id, { replace: true }); return true; }
    if (fallbackPath) NavigationController.go(fallbackPath, { replace: true });
    return false;
  },
  handleFinished(roundIds) {
    const route = NavigationController.current();
    if (route.name === 'result') return; // shown after the current one closes
    const state = StateManager.get();
    // Someone watching a round they did not join still sees its draw.
    if (route.name === 'auction' && roundIds.indexOf(route.param) !== -1) {
      const r = AuctionManager.getRound(state, route.param);
      if (r && !AuctionManager.isUserIn(r)) { NavigationController.go('result/' + r.id, { replace: true }); return; }
    }
    this.next();
  },
};

/* =====================================================================
   UI RENDERER
   ===================================================================== */
const UI = {
  screen: null,
  tabbar: null,
  lastRouteKey: '',
  liveSig: '',
  activeRoulette: null,
  toastTimer: 0,

  init() {
    this.screen = document.getElementById('screen');
    this.tabbar = document.getElementById('tabbar');
    this.buildTabbar();
    window.addEventListener('scroll', () => {
      const bar = this.screen.querySelector('.topbar');
      if (bar) bar.classList.toggle('scrolled', window.scrollY > 4);
    }, { passive: true });
  },

  buildTabbar() {
    const items = [['home', 'Главная', 'home'], ['collection', 'Коллекция', 'cards'], ['rating', 'Рейтинг', 'trophy'], ['profile', 'Профиль', 'user']];
    for (const [route, label, ic] of items) {
      this.tabbar.appendChild(h('button', {
        class: 'tab', type: 'button', dataset: { route }, 'aria-label': label,
        onClick: () => { SoundManager.tap(); NavigationController.go(route, { replace: true }); },
      }, icon(ic), h('span', { text: label })));
    }
  },

  toast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.toggle('above-cta', !!this.screen.querySelector('.cta-bar'));
    el.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  },

  /** Full render of the current route. */
  render(force) {
    const route = NavigationController.current();
    const key = route.name + '/' + (route.param || '');
    const isNewRoute = key !== this.lastRouteKey;
    // The result screen owns its own lifecycle; re-rendering it would restart the roulette.
    if (!isNewRoute && route.name === 'result' && !force && this.screen.firstChild) return;
    if (this.activeRoulette && isNewRoute) { this.activeRoulette = null; }
    this.lastRouteKey = key;
    const state = StateManager.get();

    let view;
    switch (route.name) {
      case 'collection': view = Screens.collection(state); break;
      case 'rating': view = Screens.rating(state); break;
      case 'profile': view = Screens.profile(state); break;
      case 'auction': view = Screens.auction(state, route.param, isNewRoute); break;
      case 'card': view = Screens.cardDetail(state, route.param, isNewRoute); break;
      case 'result': view = Screens.result(state, route.param); break;
      default: view = Screens.home(state);
    }
    if (!view) return; // screen redirected
    const scroll = isNewRoute ? 0 : window.scrollY;
    this.screen.replaceChildren(view);
    window.scrollTo(0, scroll);

    const showTabs = NavigationController.isTab(route.name);
    this.tabbar.hidden = !showTabs;
    this.tabbar.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.route === route.name;
      t.classList.toggle('active', on);
      if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    this.liveSig = this.liveSignature(Utils.now());
    this.updateLive(Utils.now());
  },

  /** Changes in this signature (status, visible participant count) need a re-render. */
  liveSignature(now) {
    return StateManager.get().rounds.map(r => r.id + ':' + r.status + ':' + AuctionManager.visibleParticipants(r, now).length).join('|');
  },

  /** Cheap per-tick updates of timers and progress bars — no re-render. */
  updateLive(now) {
    const state = StateManager.get();
    this.screen.querySelectorAll('[data-countdown]').forEach((el) => {
      const r = AuctionManager.getRound(state, el.dataset.countdown);
      if (!r) return;
      const rem = AuctionManager.remaining(r, now);
      const txt = Utils.formatTimer(rem);
      if (el.textContent !== txt) el.textContent = txt;
      const urgent = r.status === 'Active' && rem <= CONFIG.URGENT_MS;
      const scope = el.closest('[data-urgent-scope]');
      if (scope) scope.classList.toggle('urgent', urgent);
      el.classList.toggle('urgent', urgent);
    });
    this.screen.querySelectorAll('[data-progress]').forEach((el) => {
      const r = AuctionManager.getRound(state, el.dataset.progress);
      if (!r) return;
      const frac = Math.max(0, Math.min(1, AuctionManager.remaining(r, now) / (r.endAt - r.startAt)));
      el.style.transform = 'scaleX(' + frac.toFixed(4) + ')';
    });
  },

  onTick(now) {
    const route = NavigationController.current();
    if (route.name !== 'result') {
      const sig = this.liveSignature(now);
      if (sig !== this.liveSig) { this.render(); return; }
    }
    this.updateLive(now);
  },

  onStateChange(reason) {
    Motion.apply();
    const route = NavigationController.current();
    // Never rebuild the result screen while it is animating.
    if (route.name === 'result' && reason !== 'reset' && reason !== 'external') return;
    this.render(reason === 'reset' || reason === 'external');
  },

  sheet({ title, text, actions }) {
    const close = () => { backdrop.remove(); panel.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    const backdrop = h('div', { class: 'sheet-backdrop', onClick: close });
    const panel = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      h('div', { class: 'grabber' }),
      h('h3', { text: title }),
      text ? (Array.isArray(text) ? text.map(t => h('p', { text: t })) : h('p', { text })) : null,
      h('div', { class: 'actions' }, actions.map(a => h('button', {
        class: 'btn btn-block ' + (a.kind || 'btn-secondary'), type: 'button', text: a.label,
        onClick: () => { close(); if (a.onClick) a.onClick(); },
      }))));
    document.addEventListener('keydown', onKey);
    document.body.append(backdrop, panel);
    const first = panel.querySelector('button'); if (first) first.focus({ preventScroll: true });
  },
};

      CardArt.render(cardId), h('div', { class: 'sheen' }));
    if (tilt) View.attachTilt(wrap);

  },

  /** Gentle pointer tilt (max ~7°), rAF-throttled, disabled with reduced motion. */
  attachTilt(el) {
    let raf = 0, rx = 0, ry = 0;
    const apply = () => { raf = 0; el.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)'; };
    el.addEventListener('pointermove', (e) => {
      if (Motion.reduced()) return;
      const r = el.getBoundingClientRect();
      ry = ((e.clientX - r.left) / r.width - 0.5) * 12;
      rx = -((e.clientY - r.top) / r.height - 0.5) * 12;
      if (!raf) raf = requestAnimationFrame(apply);
    });
    const reset = () => { rx = 0; ry = 0; el.style.transition = 'transform .45s cubic-bezier(.2,.8,.2,1)'; apply(); setTimeout(() => { el.style.transition = ''; }, 460); };
    el.addEventListener('pointerleave', reset);
    el.addEventListener('pointerup', reset);
    el.addEventListener('pointercancel', reset);
  },
};

    const finished = state.rounds.filter(r => r.status === 'Completed' || r.status === 'Cancelled');

      h('div', { class: 'greeting' },
        h('p', { class: 'hello', text: 'Добро пожаловать' }),
        h('h1', { text: 'Активные аукционы' })),
      active.length
        ? h('div', { class: 'auction-list' }, active.map(r => Screens.auctionTile(state, r, now)))
        : h('p', { class: 'empty-note', text: 'Сейчас активных аукционов нет. Чтобы снова проверить механику, сбросьте демо в профиле.' }),
      finished.length ? h('section', { class: 'section' },
        h('div', { class: 'section-head' }, h('h2', { class: 'section-title', text: 'Итоги' })),
        h('div', { class: 'auction-list', style: 'margin-top:0' }, finished.map(r => Screens.auctionTile(state, r, now)))) : null,
      h('p', { class: 'demo-footnote', text: 'Демо-версия. Розыгрыши бесплатные, соперники Alex, Timur и Samir — демонстрационные участники. Данные хранятся только на этом устройстве.' }));
  },

  auctionTile(state, round, now) {
    const card = CardManager.get(round.cardId);
    const visible = AuctionManager.visibleParticipants(round, now);
    const finished = round.status === 'Completed' || round.status === 'Cancelled';
    let bottom;
    if (finished) {
      if (round.status === 'Cancelled') bottom = h('p', { class: 'winner-line', text: 'Недостаточно участников' });

  result(state, roundId) {
    const round = AuctionManager.getRound(state, roundId);

    if (!round.result) { NavigationController.go('auction/' + round.id, { replace: true }); return null; }
    const card = CardManager.get(round.cardId);
    const res = round.result;
    const n = res.order.length;
    const shouldAnimate = !res.revealed && !Motion.reduced() && !res.cancelled && n > 0;

    const close = () => { UI.activeRoulette = null; RevealQueue.next('home'); };
    const root = h('div', { class: 'result', role: 'dialog', 'aria-label': 'Результат розыгрыша' },
      h('div', { class: 'result-top' },

        h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Закрыть', onClick: () => { if (UI.activeRoulette) UI.activeRoulette.skip(); else close(); } }, trustedSvg('<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'))));

    const makeTile = (i) => {
      const id = res.order[i];
      const isMe = id === CONFIG.USER_ID;
      return h('div', { class: 'r-tile' }, People.avatar(state, id, 44),
        h('span', { class: 'r-name', text: isMe ? 'Вы' : People.displayName(state, id) }),
        h('span', { class: 'r-tag', text: isMe ? state.profile.name : 'демо' }));
    };

    const head = h('div', null,
      h('h2', { class: 'result-title', text: res.cancelled ? 'Раунд отменён' : (shouldAnimate ? 'Определяем победителя' : 'Итоги розыгрыша') }),
      h('p', { class: 'result-sub', text: res.cancelled ? res.reason : n + ' ' + Utils.plural(n, 'участник', 'участника', 'участников') + ' · шанс каждого ' + Utils.formatPercent(100 / n) }));
    root.appendChild(head);

    const roulette = h('div', { class: 'roulette', 'aria-hidden': 'true' }, h('div', { class: 'roulette-pointer' }));
    const note = h('p', { class: 'roulette-note', text: 'Победитель определён до анимации · crypto.getRandomValues' });
    if (!res.cancelled) root.append(roulette, note);

    const showReveal = (animated) => {
      head.querySelector('.result-title').textContent = 'Итоги розыгрыша';
      const isMe = res.winnerId === CONFIG.USER_ID;
      const winnerName = res.cancelled ? '' : People.displayName(state, res.winnerId);
      const reveal = h('div', { class: 'reveal' },
        View.cardArt(card.id, { enter: animated }),
        res.cancelled
          ? h('p', { class: 'result-sub', text: 'Карточка остаётся без владельца.' })
          : [
            h('h3', { class: 'result-title fade-up d1', text: isMe ? 'Поздравляем!' : 'Победитель — ' + winnerName }),
            h('p', { class: 'result-sub fade-up d2', text: isMe ? 'Вы получили ' + card.name + ' #' + card.id : 'Карточка ' + card.name + ' #' + card.id + ' передана демо-участнику ' + winnerName }),
            h('div', { class: 'winner-chip fade-up d3' }, People.avatar(state, res.winnerId, 32), isMe ? state.profile.name : winnerName, isMe ? null : h('span', { class: 'tag-demo', text: 'демо' })),
          ]);
      const actions = h('div', { class: 'result-actions fade-up d4' },
        isMe
          ? [h('button', { class: 'btn btn-primary btn-block', type: 'button', text: 'Открыть коллекцию', onClick: () => { UI.activeRoulette = null; RevealQueue.next('collection'); } }),
             h('button', { class: 'btn btn-ghost btn-block', type: 'button', text: 'На главную', onClick: close })]
          : [h('button', { class: 'btn btn-secondary btn-block', type: 'button', text: 'Продолжить', onClick: close })]);
      root.append(reveal, actions);
      if (!res.revealed) {
        if (isMe) { SoundManager.win(); TelegramBridge.haptic('success'); } else if (!res.cancelled) SoundManager.lose();
        AuctionManager.markRevealed(round.id);
      }
    };

    if (shouldAnimate) {
      // Start after the element is in the DOM so tile widths can be measured.
      requestAnimationFrame(() => {
        if (!root.isConnected) return;
        UI.activeRoulette = RouletteController.play({
          host: roulette, makeTile, count: n, winnerIndex: res.winnerIndex, duration: CONFIG.ROULETTE_MS,
          onDone: () => { UI.activeRoulette = null; if (root.isConnected) showReveal(true); },
        });

        requestAnimationFrame(() => {

          roulette.appendChild(strip);

      showReveal(false);

    return root;

            h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Анимации' },
              h('button', { type: 'button', role: 'radio', 'aria-checked': String(!reduced), class: !reduced ? 'on' : '', text: 'Вкл', onClick: () => ProfileManager.setSetting('motion', 'full') }),
              h('button', { type: 'button', role: 'radio', 'aria-checked': String(reduced), class: reduced ? 'on' : '', text: 'Меньше', onClick: () => ProfileManager.setSetting('motion', 'reduced') }))),
          h('button', { class: 'list-row', type: 'button', onClick: Screens.confirmReset }, icon('reset'),
            h('div', { class: 'grow' }, h('div', { class: 'title', style: 'color:var(--danger)', text: 'Сбросить демо' }), h('div', { class: 'sub', text: 'Баланс, коллекция и раунды вернутся к началу' }))),
          h('button', { class: 'list-row', type: 'button', onClick: Screens.showAbout }, icon('info'),
            h('div', { class: 'grow' }, h('div', { class: 'title', text: 'О приложении' })), icon('chevron')))));
  },

  confirmReset() {
    UI.sheet({
      title: 'Сбросить демо?',
      text: 'Коллекция, история и результаты будут удалены. Баланс снова станет 500 монет, оба аукциона начнутся заново с новыми раундами. Настройки сохранятся.',
      actions: [
        { label: 'Сбросить', kind: 'btn-danger', onClick: () => { StateManager.reset(); NavigationController.go('home', { replace: true }); UI.toast('Демо сброшено'); } },
        { label: 'Отмена', kind: 'btn-secondary' },
      ],
    });
  },

  showAbout() {
    UI.sheet({
      title: 'CardArena ' + CONFIG.APP_VERSION,
      text: [
        'Демонстрационный прототип коллекционной платформы для Telegram Mini Apps.',
        'Всё работает локально: без сервера, без платежей и без сетевых запросов. Соперники и рейтинг — демонстрационные.',
        'Победитель выбирается через crypto.getRandomValues с равными шансами. Данные хранятся в localStorage этого устройства и не защищены от изменения — для настоящей защиты нужен сервер.',
      ],
      actions: [{ label: 'Понятно', kind: 'btn-secondary' }],
    });
  },
};

/* =====================================================================
   APP BOOTSTRAP
   ===================================================================== */
const App = {
  tickTimer: 0,

  supportsRequired() {
    return !!(window.crypto && typeof window.crypto.getRandomValues === 'function' &&
      window.JSON && window.requestAnimationFrame && document.querySelector && window.history && window.history.replaceState &&
      Array.prototype.find && window.Uint32Array && 'classList' in document.documentElement);
  },

  fatal(title, text) {
    const app = document.getElementById('app');
    app.replaceChildren(h('div', { class: 'fatal' }, h('h1', { text: title }), h('p', { text })));
  },

  start() {
    if (!this.supportsRequired()) {
      this.fatal('Браузер не поддерживается', 'Для CardArena нужен современный браузер с поддержкой Web Crypto API. Обновите Chrome или Telegram и попробуйте снова.');
      return;
    }
    TelegramBridge.init();
    StateManager.load();
    Motion.apply();
    if (Motion.mq && Motion.mq.addEventListener) Motion.mq.addEventListener('change', () => { Motion.apply(); });
    UI.init();

    const banner = document.getElementById('banner');
    if (!StorageManager.isPersistent()) {
      banner.textContent = 'Хранилище браузера недоступно — прогресс не сохранится после закрытия.';
      banner.hidden = false;
    }

    // Settle rounds that ended while the app was closed BEFORE first render,
    // so the user lands on the correct screen (Scenario G).
    AuctionManager.tick(Utils.now());

    StateManager.subscribe((reason) => UI.onStateChange(reason));
    // popstate covers Android/browser back; hashchange covers manual edits.
    window.addEventListener('popstate', () => UI.render());
    window.addEventListener('hashchange', () => UI.render());
    window.addEventListener('storage', (e) => { if (e.key === CONFIG.STORAGE_KEY) StateManager.handleExternalChange(); });
    document.addEventListener('pointerdown', () => SoundManager.unlock(), { passive: true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.loop(); });

    // A refresh on the result route of an unseen result just replays it;
    // otherwise jump to any pending result first.
    const route = NavigationController.current();
    if (route.name !== 'result' && AuctionManager.pendingReveals(StateManager.get()).length) RevealQueue.next();
    else UI.render();

    if (StateManager.wasRecovered()) UI.toast('Сохранённые данные были повреждены — демо создано заново');
    this.tickTimer = setInterval(() => this.loop(), 250);
  },

  loop() {
    const now = Utils.now();
    const finished = AuctionManager.tick(now);
    if (finished.length) RevealQueue.handleFinished(finished);
    UI.onTick(now);
  },
};

// Read-only diagnostics hook (handy in DevTools; does not expose mutations).
window.CardArena = Object.freeze({
  version: CONFIG.APP_VERSION,
  snapshot: () => Utils.deepClone(StateManager.get()),
});

try { App.start(); }
catch (err) {
  console.error(err);
  App.fatal('Не удалось запустить CardArena', 'Произошла ошибка при запуске. Попробуйте обновить страницу. Если проблема повторится, сбросьте данные сайта в настройках браузера.');
}
</script>
</body>
</html>
