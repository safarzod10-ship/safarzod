<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
<style>
.k{stroke:#0c1030;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.b{animation:b 1.1s infinite}.b2{animation:b 0.8s .3s infinite}.b3{animation:b 1.4s .6s infinite}
@keyframes b{0%,100%{opacity:1}50%{opacity:.2}}
.fan{transform-origin:196px 98px;animation:s .5s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.glow{animation:g 2s ease-in-out infinite}@keyframes g{0%,100%{opacity:.55}50%{opacity:1}}
</style>
