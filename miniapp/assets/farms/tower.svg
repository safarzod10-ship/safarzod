<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
<style>
.k{stroke:#140c30;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.b{animation:b 1s infinite}.b2{animation:b .7s .2s infinite}.b3{animation:b 1.3s .5s infinite}
@keyframes b{0%,100%{opacity:1}50%{opacity:.2}}
.ring{stroke-dasharray:18 10;animation:r 1.6s linear infinite}@keyframes r{to{stroke-dashoffset:-56}}
.tip{animation:t 1.2s ease-in-out infinite}@keyframes t{0%,100%{opacity:.4}50%{opacity:1}}
</style>
