<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TERRIA — загрузка (превью)</title>
<link rel="preload" href="bg.webp" as="image">
<style>html,body{margin:0;height:100%;background:#cfe3c0 url(preview-game.webp) center/cover no-repeat;font:14px system-ui,sans-serif}
#again{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 18px;border:0;border-radius:20px;background:#fff;color:#123;font-weight:600;display:none}</style>
</head>
<body>
<script src="terria-loader2.js" data-bg="bg.webp"></script>
<button id="again" onclick="location.reload()">Ещё раз</button>
<script>
// Preview only: fake loading progress, then finish.
(function () {
  if (/[?&]manual/.test(location.search)) return; // the test drives progress itself
  var p = 0;
  (function step() {
    p += 0.05 + Math.random() * 0.12; TerriaLoader.set(p);
    if (p < 1) setTimeout(step, 220 + Math.random() * 300); else setTimeout(function () { TerriaLoader.done(); }, 900);
  })();
  addEventListener('terria-loader-done', function () { document.getElementById('again').style.display = 'block'; });
})();
</script>
</body>
</html>
