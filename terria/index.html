<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3f6b34" />
    <meta name="color-scheme" content="light" />
    <title>TERRIA</title>
    <!-- Loading screen (public/loader): the picture behind it and the logo it assembles. -->
    <link rel="preload" href="/loader/bg.webp" as="image" fetchpriority="high" />
    <link rel="preload" href="/loader/terria-logo.webp" as="image" crossorigin="anonymous" />
    <style>
      html,
      body {
        background: #3f6b34;
      }
    </style>
  </head>
  <body>
    <!-- First in <body> so the loading screen is there on the first paint. -->
    <script src="/loader/terria-loader.js" data-logo="/loader/terria-logo.webp" data-bg="/loader/bg.webp"></script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
