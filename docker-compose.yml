name: roulette-arena

services:
  app:
    build: .
    image: roulette-arena
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?запустите ./setup.sh}
      ADMIN_ID: ${ADMIN_ID:?запустите ./setup.sh}
      SUPPORT_USERNAME: ${SUPPORT_USERNAME:-}
      CHANNEL_URL: ${CHANNEL_URL:-https://t.me/safroulette}
      CHAT_URL: ${CHAT_URL:-https://t.me/safroulette_chat}
      PUBLIC_URL: https://${DOMAIN:?запустите ./setup.sh}/
      REF_PERCENT: ${REF_PERCENT:-15}
      WAGER_DEPOSIT: ${WAGER_DEPOSIT:-3}
      WAGER_BONUS: ${WAGER_BONUS:-3}
      BASKET_PRICE: ${BASKET_PRICE:-5}
      BASKET_DAILY_PRIZE: ${BASKET_DAILY_PRIZE:-50}
      GRAM_WALLET: ${GRAM_WALLET:-}
      TONCENTER_API_KEY: ${TONCENTER_API_KEY:-}
      GRAM_RATE: ${GRAM_RATE:-140}
      GRAM_MIN_DEPOSIT: ${GRAM_MIN_DEPOSIT:-0.1}
      GRAM_MIN_WITHDRAW: ${GRAM_MIN_WITHDRAW:-1}
    volumes:
      - app_data:/data
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

volumes:
  app_data:
  caddy_data:
  caddy_config:
