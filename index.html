#boot.out { opacity: 0; pointer-events: none; }
#boot * { box-sizing: border-box; }

/* warm glow and embers */
.sp-glow { position: absolute; left: 50%; top: 40%; width: min(150vw, 760px); aspect-ratio: 1; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(255, 150, 70, .26), rgba(255, 120, 40, .08) 50%, rgba(255, 120, 40, 0) 75%);
  animation: sp-in 1s ease both, sp-breath 3.2s ease-in-out 1s infinite; }
@keyframes sp-in { from { opacity: 0; } }
@keyframes sp-breath { 50% { opacity: .7; transform: translate(-50%, -50%) scale(.94); } }
.sp-emb i { position: absolute; bottom: -12px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%;
  background: #ffb06a; box-shadow: 0 0 6px 1px rgba(255, 120, 30, .9); opacity: 0; animation: sp-rise var(--d) linear var(--t) infinite; }
@keyframes sp-rise { 0% { opacity: 0; transform: translate(0, 0); } 12% { opacity: .9; } 70% { opacity: .5; }
  100% { opacity: 0; transform: translate(var(--dx), -75vh); } }

/* logo box: crown + wordmark, 460 x 346 source px */
.sp-logo { position: absolute; left: 50%; top: 40%; width: min(82vw, 380px); aspect-ratio: 460 / 346; transform: translate(-50%, -58%); }
.sp-float { position: absolute; inset: 0; animation: sp-float 3.4s ease-in-out 2s infinite; }
@keyframes sp-float { 50% { transform: translateY(-6px) rotate(-.6deg); } }
.sp-word { position: absolute; left: 0; top: 32.66%; width: 100%; aspect-ratio: 460 / 233; }
.sp-word > i, .sp-shine { position: absolute; inset: 0; background: 0 0 / 100% 100% no-repeat; }
.sp-word > i { opacity: 0; animation: sp-stamp .42s cubic-bezier(.2, .9, .3, 1.25) var(--at) both; transform-origin: var(--ox) 60%; }
.sp-word > .l1 { background-image: var(--l1); --at: .15s; --ox: 23%; }
