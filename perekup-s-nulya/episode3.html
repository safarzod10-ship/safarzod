/* ---------- episode props ---------- */
function eye(x, y, s) {
  at(x, y, s, 0, () => {
    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.quadraticCurveTo(0, -26, 30, 0); ctx.quadraticCurveTo(0, 26, -30, 0);
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 5; ctx.stroke();
    circ(0, 0, 10, OL);
  });
}
function camera(x, y, s, crossed) {
  at(x, y, s, 0, () => {
    rr(-60, -40, 90, 80, 14, '#334155', OL, 6);
    ctx.beginPath(); ctx.moveTo(30, -10); ctx.lineTo(62, -30); ctx.lineTo(62, 30); ctx.lineTo(30, 10); ctx.closePath();
    ctx.fillStyle = '#334155'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 6; ctx.stroke();
    circ(-15, 0, 18, '#93c5fd', OL, 4);
    if (crossed) cross(0, 0, 60, '#ef4444', 14);
  });
}
function shield(x, y, s) {
  at(x, y, s, 0, () => {
    ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(50, -40); ctx.quadraticCurveTo(50, 30, 0, 64); ctx.quadraticCurveTo(-50, 30, -50, -40); ctx.closePath();
    ctx.fillStyle = '#22c55e'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 6; ctx.stroke();
    check(0, 0, 1.1, 1, '#fff');
  });
}
function heart(x, y, s, col = '#ef4444') {
  at(x, y, s, 0, () => {
    ctx.beginPath(); ctx.moveTo(0, 40);
    ctx.bezierCurveTo(-70, -10, -40, -70, 0, -30); ctx.bezierCurveTo(40, -70, 70, -10, 0, 40);
    ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 6; ctx.stroke();
  });
}
function briefcase(x, y, s) {
  at(x, y, s, 0, () => {
    rr(-30, -70, 60, 30, 10, null, OL, 8);
    rr(-90, -46, 180, 120, 16, '#92400e', OL, 7);
    line([-90, 0, 90, 0], OL, 5); rr(-14, -10, 28, 22, 4, '#facc15', OL, 4);
  });
}
function wallet(x, y, s, t) {
  at(x, y, s, 0, () => {

    ctx.beginPath(); ctx.ellipse(mx - 14, my, 16, 10 * fl + 3, -.4, 0, Math.PI * 2); ctx.ellipse(mx + 14, my, 16, 10 * fl + 3, .4, 0, Math.PI * 2);
    ctx.fillStyle = '#cbd5e1'; ctx.fill(); circ(mx, my, 6, '#64748b');
  });
}

    rr(-150, -260, 300, 520, 48, '#111827', OL, 7);
    rr(-136, -246, 272, 492, 38, ok ? '#dcfce7' : '#fff1f2');

function personCard(t, x, y, w, h, cfg, label, col, k) {
  if (k <= 0) return;
  const [dx, dy] = shk(t, 98.4, .5, 10);
  at(x + dx, y + dy, k, .02, () => {
    rr(-w / 2, -h / 2, w, h, 30, '#dbeafe', col, 9);
    ctx.save(); ctx.beginPath(); ctx.roundRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 24); ctx.clip();
    person(Object.assign({}, cfg, { x: 0, y: 290, s: 1 }), t);
    ctx.restore();
    const lw = tw(label, 34, 800) + 40;
    rr(-lw / 2, h / 2 - 28, lw, 56, 28, col, OL, 5);
    txt(label, 0, h / 2, 34, '#fff', { w: 800 });
  });
}
const reveal = (t, s, x, y, size, col, a, b, al = 'left', w = 800) => {
  const k = P(t, a, b); if (k <= 0) return;
  const wd = tw(s, size, w);
  ctx.save(); ctx.beginPath();
  const x0 = al === 'center' ? x - wd / 2 : x;
  ctx.rect(x0 - 10, y - size, (wd + 20) * k, size * 2); ctx.clip();
  txt(s, x, y, size, col, { w, al }); ctx.restore();
};
