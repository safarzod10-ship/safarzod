/* ---------- helpers ---------- */
function grade(col, a) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = a; ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function lampGlow(x, y, r, col = '255,200,120', a = .45) {
  const g = ctx.createRadialGradient(x, y, 10, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function card(x, y, w, h, k, fn, rot = 0, border = OL) {
  if (k <= 0) return;
  at(x, y, k, rot, () => {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
    rr(-w / 2, -h / 2, w, h, 28, '#fffdf7'); ctx.restore();
    rr(-w / 2, -h / 2, w, h, 28, null, border, 6);
    fn();
  });
}
const creditOn = t => t < 51.2;
function creditPill(t) {
  const k = P(t, .5, .8) * (1 - P(t, 51.2, 51.6));

    rr(-190, -32, 380, 64, 32, '#e5484d', OL, 5);

  });
}
// gaming PC: monitor + tower, drawn at (x, y) = bottom centre of the monitor stand
function pcSet(x, y, s, t) {
  at(x, y, s, 0, () => {
    const hue = (t * 40) % 360;
    rr(-180, -250, 360, 230, 14, '#0d0f16', OL, 7);
    const sg = ctx.createLinearGradient(0, -234, 0, -36); sg.addColorStop(0, '#2b1f5c'); sg.addColorStop(1, '#4b2c84'); rr(-166, -236, 332, 200, 8, sg);
    txt('RTX', 0, -136, 54, 'rgba(255,255,255,.75)', { w: 900 });
    rr(-20, -20, 40, 20, 4, '#0d0f16', OL, 4);
    rr(-80, -2, 160, 12, 5, '#0d0f16', OL, 4);
    rr(210, -210, 90, 210, 10, '#11131d', OL, 6);
    ctx.save(); ctx.shadowColor = `hsl(${hue},90%,60%)`; ctx.shadowBlur = 30;
    rr(222, -196, 66, 8, 4, `hsl(${hue},90%,60%)`); rr(222, -26, 66, 8, 4, `hsl(${(hue + 120) % 360},90%,60%)`); ctx.restore();
    circ(255, -110, 26, '#1e2235', `hsl(${hue},90%,60%)`, 5);
  });
}
function bgPCRoom(t, pcK = 1) {

  if (pcK > 0) { ctx.save(); ctx.globalAlpha = pcK; pcSet(740, 1110, 1, t); ctx.restore(); }
}

}

}
function iphoneGrid(t, a, cx, cy) {
  for (let i = 0; i < 20; i++) {

}

function e6(t) {
