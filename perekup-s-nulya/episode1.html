// 1. Hook 0–12
function s1(t) {

  // counter

  if (ca > 0) {
    const mv = eio(P(t, 3.3, 3.8));

    const [dx, dy] = shk(t, .45, .4, 22);
    at(540 + dx, y + dy, sc0, 0, () => {
      txt('СТАРТОВЫЙ БЮДЖЕТ', 0, -120, 44, '#9fb3ff', { w: 700 });

// 2. Who am I 12–30
function s2(t) {
  bgRoom(false, t);
  // calendar
  const ck = pop(t, 14.9) * (1 - P(t, 20.8, 21.1));
  if (ck > 0) {
    at(770, 560, ck, .05, () => {
      rr(-150, -170, 300, 330, 22, '#fff', OL, 8);

      txt(n === 1 ? 'МЕСЯЦ' : n < 5 ? 'МЕСЯЦА' : 'МЕСЯЦЕВ', 0, -125, 40, '#fff', { w: 900 });

    ctx.save(); ctx.globalAlpha = dk;
    rr(40, 360, 1000, 420, 30, 'rgba(255,255,255,.9)', OL, 7);

      { x: 200, a: 21.3, lbl: 'КУПИЛ', sub: 'дешевле', col: '#3b82f6' },
      { x: 540, a: 23.0, lbl: 'ПОЧИНИЛ', sub: 'в порядок', col: '#f59e0b' },
      { x: 880, a: 24.8, lbl: 'ПРОДАЛ', sub: 'дороже', col: '#22b07d' },

    nodes.forEach((n, i) => {
      const k = pop(t, n.a);
      if (i > 0) {
        const ak = P(t, n.a - .5, n.a);
        if (ak > 0) {
          const x0 = nodes[i - 1].x + 105, x1 = lerp(x0, n.x - 115, ak);

          if (ak > .95) { line([x1 - 22, 500, x1, 520, x1 - 22, 540], OL, 10); }
        }
      }
      at(n.x, 520, k, 0, () => {
        circ(0, 0, 95, n.col, OL, 8);
        if (i === 0) phone(0, 0, 60, 108, { s1: '#e0f2fe', s2: '#93c5fd' });
        if (i === 1) wrench(0, -16, .85, .7);
        if (i === 2) { coin(-24, 14, 36); coin(22, -14, 36); }
        txt(n.lbl, 0, 140, 42, OL, { w: 900 });
        txt(n.sub, 0, 186, 32, '#475569', { w: 600 });

    const pk = pop(t, 27.3);
    at(870, 400, pk, .15, () => {

// 3. Search 30–55

function s3(t) {

        const w = Math.max(...ls.map(s => tw(s, 32, 600))) + 44;
        const x0 = me ? -w : 0;

  ctx.restore(); ctx.restore();
  // arrow to target
  const ak = P(t, 37, 37.3) * (1 - P(t, 42.8, 43.1));
  if (ak > 0) {

      [44.6, 'Экран', '+ 5 000', OL],
      [46.0, 'Вложу', '24 000', OL],
      [47.6, 'Продам', '27 000', '#2563eb'],

    rows.forEach(([rt, a, b, c], i) => {
      const k = P(t, rt, rt + .25); if (k <= 0) return;

// 4. Metro 55–85

  const z = lerp(1.12, 1, eio(P(t, 55, 58))) * lerp(1, 1.22, eio(P(t, 73.5, 75))) / lerp(1, 1.22, eio(P(t, 76.8, 77.4)));

    bgStreet(t);
    // seller
    const run = P(t, 81, 82.6);
    let sxp = lerp(780, 720, eio(P(t, 67.5, 68.2)));
    sxp += run * run * 760;
    const sTalk = talkAmt('S', t);
    let saL = POSE.watch, saR = POSE.idle, sex = 'angry', sScale = 1.5;
    if (within(t, 61, 67.5)) { saL = POSE.watch; sex = 'n'; }
    if (within(t, 67.5, 70)) { saL = POSE.shrug; saR = POSE.shrug; sex = 'angry'; }
    if (within(t, 70, 73.5)) { sScale = lerp(1.5, 1.62, eout(P(t, 70, 70.6))); saL = POSE.watch; }
    if (within(t, 77, 81)) { saL = POSE.idle; saR = POSE.give; sex = 'smirk'; }
    if (t >= 81) { sex = 'smirk'; saL = [.8, -.5]; saR = [.8, -.5]; }
