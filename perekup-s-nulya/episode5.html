<style>

#time{font:600 14px Rubik,Arial;min-width:92px;text-align:right;opacity:.8}
body.render #ui{display:none}
body.render #wrap{padding:0}
body.render canvas{height:auto;border-radius:0}
</style>
</head>

</div>
<script src="engine.js"></script>
<script>

const DAYS = [{ t: 15.3, d: 73 }, { t: 36.0, d: 75 }, { t: 56.3, d: 76 }, { t: 82.3, d: 80 }, { t: 102.5, d: 100 }];

const SUBS = [

  [6.6, 9.6, 'T', 'Сегодня я хочу рассказать *немного о себе*.'],

  [18.0, 21.0, 'O', 'Тимур… садись. Нам надо поговорить.'],
  [21.0, 26.0, 'O', 'Твой отец *жив*. Он приходил на днях. Спрашивал про тебя.'],

  [90.5, 95.8, 'T', 'Беру *в кредит* компьютер для стримов. *90 000*.'],

  [102.5, 110.0, 'T', 'День 100. Двадцать дней эфиров. Заработал — *ноль*. А платёж по кредиту — *5 000* каждый месяц.'],
  [110.0, 113.5, 'O', 'Сынок… ты не спишь уже *который день*.'],

  [118.0, 123.0, 'T', 'Не всегда то, что хочешь, *получается*. Даже если очень стараешься.'],

  [126.5, 135.0, 'T', 'И у меня к вам просьба. Если вам нравится этот сериал и вы хотите, чтобы история Тимура продолжалась — *поддержите нас*. Ссылка в профиле.'],
  [135.0, 141.0, 'T', 'Каждый донат — это *новые серии*. А зачем именно сейчас нужна ваша поддержка — расскажу *в следующем видео*.'],

const MONEY = [{ t: 64.5, d: -58000 }];

const MAMA = { skin: '#efc29e', shirt: '#b4687f', pants: '#3f3f52', hair: 'long', hairCol: '#5a3a2a', iris: '#5b3b22', pocket: false };
const FATHER = { skin: '#d4a07a', shirt: '#5b5f6b', pants: '#2b2f3a', hair: 'short', hairCol: '#55524f', stubble: true, collar: '#454852', tired: true, zip: true, pocket: false };
const COLL = { skin: '#d8a27a', shirt: '#1c1e24', pants: '#121317', hair: 'bald', hairCol: '#3a3a3a', glasses: 'sun', zip: true, collar: '#0b0c0f', shoe: '#0b0c0f', pocket: false };

/* ---------- mood helpers ---------- */
function grade(col, a) {
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = a; ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function rain(t, x0, y0, w, h, n = 60, a = .5) {
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
  ctx.strokeStyle = `rgba(200,220,255,${a})`; ctx.lineWidth = 2;
  for (let i = 0; i < n; i++) {
    const x = x0 + ((hash(i) * w + t * 60) % w), y = y0 + ((hash(i + 50) * h + t * (700 + hash(i + 9) * 300)) % h);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 26); ctx.stroke();
  }
  ctx.restore();
}
function lampGlow(x, y, r, col = '255,200,120', a = .45) {
  const g = ctx.createRadialGradient(x, y, 10, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function creditPill(t) {
  if (t < 93) return;
  at(540, 428, pop(t, 93) * (1 - P(t, VOTE_AT, VOTE_AT + .3)), 0, () => {
    rr(-190, -32, 380, 64, 32, '#e5484d', OL, 5);
    txt('КРЕДИТ −90 000 ₽', 0, 3, 32, '#fff', { w: 900 });
  });
}
function card(x, y, w, h, k, fn, rot = 0, border = OL) {
  if (k <= 0) return;
  at(x, y, k, rot, () => {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
    rr(-w / 2, -h / 2, w, h, 28, '#fffdf7'); ctx.restore();
    rr(-w / 2, -h / 2, w, h, 28, null, border, 6);
    fn();
  });
}
function bottle(x, y, s) {
  at(x, y, s, .25, () => {
    rr(-26, -60, 52, 120, 16, '#2f6b4f', OL, 5); rr(-10, -100, 20, 46, 6, '#2f6b4f', OL, 5);
    rr(-20, -20, 40, 40, 6, '#e9dcc0'); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(-18, -54, 8, 90);
  });
}

/* ---------- backgrounds ---------- */
function bgNightRoom(t) {
  bgRoom(true, t);
  rain(t, 618, 438, 324, 384, 50, .45);
  grade('#7c8ab8', .35);
}
function bgKitchen(t) {
  const g = ctx.createLinearGradient(0, 0, 0, 1300); g.addColorStop(0, '#7a6556'); g.addColorStop(1, '#a88a72');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 1300);
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 3;
  for (let y = 760; y < 1180; y += 60) for (let x = 0; x < W; x += 60) ctx.strokeRect(x, y, 60, 60);
  // window with rain
  rr(620, 380, 340, 360, 12, '#e9e2d6', OL, 7);
  const sky = ctx.createLinearGradient(0, 390, 0, 730); sky.addColorStop(0, '#1b2140'); sky.addColorStop(1, '#3a4570');
  rr(636, 396, 308, 328, 6, sky);
  for (let i = 0; i < 7; i++) rr(650 + i * 42, 600 - hash(i) * 120, 30, 140 + hash(i) * 120, 2, '#141831');
  for (let i = 0; i < 14; i++) if (hash(i + 30) > .4) rr(656 + (i % 7) * 42, 620 - hash(i) * 100 + Math.floor(i / 7) * 40, 10, 12, 1, '#ffd27a');
  rain(t, 636, 396, 308, 328, 40, .5);
  line([790, 390, 790, 730], '#e9e2d6', 10);
  // fridge
  rr(60, 520, 230, 790, 24, '#d9dee6', OL, 7); line([60, 800, 290, 800], OL, 5); rr(250, 600, 14, 110, 7, '#9aa4b2'); rr(250, 840, 14, 140, 7, '#9aa4b2');
  // lamp
  line([540, 0, 540, 260], '#222', 4);
  ctx.beginPath(); ctx.moveTo(470, 300); ctx.lineTo(610, 300); ctx.lineTo(570, 250); ctx.lineTo(510, 250); ctx.closePath(); ctx.fillStyle = '#3a3a3a'; ctx.fill();
  lampGlow(540, 330, 520);
  // floor + table
  ctx.fillStyle = '#5b4535'; ctx.fillRect(0, 1300, W, H - 1300);
  rr(380, 1180, 520, 30, 8, '#8a6346', OL, 6); rr(420, 1210, 22, 200, 4, '#6b4c35', OL, 4); rr(840, 1210, 22, 200, 4, '#6b4c35', OL, 4);
  rr(560, 1140, 46, 42, 10, '#f2efe9', OL, 4); rr(700, 1140, 46, 42, 10, '#e9b8a4', OL, 4);
  ctx.save(); ctx.globalAlpha = .5; for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.moveTo(583 + i * 140, 1130); ctx.quadraticCurveTo(570 + i * 140 + Math.sin(t * 2 + i) * 12, 1090, 590 + i * 140, 1060); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); } ctx.restore();
}
function bgCafe(t) {
  ctx.fillStyle = '#1f3b3d'; ctx.fillRect(0, 0, W, H);
  // big window with passing train lights
  rr(40, 330, 1000, 600, 10, '#0e1b26', '#3a5153', 12);
  ctx.save(); ctx.beginPath(); ctx.rect(46, 336, 988, 588); ctx.clip();
  for (let i = 0; i < 8; i++) circ(80 + hash(i) * 900, 420 + hash(i + 3) * 400, 60 + hash(i + 6) * 50, `rgba(255,${180 + hash(i) * 60 | 0},120,.18)`);
  const tx = ((t * 520) % 2600) - 800;
  rr(tx, 640, 1400, 200, 20, '#3d4a5a'); for (let i = 0; i < 12; i++) rr(tx + 40 + i * 110, 670, 80, 60, 8, '#ffe2a0');
  rain(t, 46, 336, 988, 588, 70, .35);
  ctx.restore();
  line([540, 330, 540, 930], '#3a5153', 10);
  // neon
  ctx.save(); ctx.shadowColor = '#ff5a7a'; ctx.shadowBlur = 30; txt('КАФЕ', 900, 290, 60, '#ff8fa3', { w: 900 }); ctx.restore();
  ctx.fillStyle = '#2a2420'; ctx.fillRect(0, 1300, W, H - 1300);
  lampGlow(540, 1000, 560, '255,190,120', .3);
}
function cafeTable() {
  rr(330, 1170, 420, 32, 10, '#7a5a40', OL, 6); rr(520, 1202, 40, 200, 6, '#4a3626', OL, 4);
  rr(400, 1132, 44, 40, 10, '#f2efe9', OL, 4); rr(640, 1132, 44, 40, 10, '#f2efe9', OL, 4);
}
function bgHall(t, open) {
  const g = ctx.createLinearGradient(0, 0, 0, 1300); g.addColorStop(0, '#4b5563'); g.addColorStop(1, '#6b7280');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 1300);
  ctx.fillStyle = '#3b3f48'; ctx.fillRect(0, 1300, W, H - 1300);
  // coat hooks
  rr(80, 520, 220, 18, 6, '#5b4636', OL, 4); for (let i = 0; i < 3; i++) circ(120 + i * 70, 548, 10, '#c0c4cc', OL, 3);
  rr(110, 560, 70, 220, 26, '#8b5e3c', OL, 5);
  // door frame + door
  rr(560, 420, 420, 890, 10, '#2b2f38', OL, 8);
  rr(580, 440, 380, 870, 6, '#11131a');
  ctx.save(); ctx.translate(580, 440);
  const k = open; // 0 closed .. 1 open
  ctx.transform(1 - .78 * k, -.08 * k, 0, 1, 0, 0);
  rr(0, 0, 380, 870, 6, '#7a4f33', OL, 6); rr(40, 60, 300, 330, 8, null, 'rgba(0,0,0,.25)', 6); rr(40, 470, 300, 330, 8, null, 'rgba(0,0,0,.25)', 6);
  circ(330, 450, 14, '#d4b46a', OL, 4);
  ctx.restore();
  lampGlow(540, 260, 600, '200,220,255', .25);
}
function bgStream(t) {
  bgRoom(true, t);
  grade('#6b6fa8', .35);
  // RGB light strip
  const hue = (t * 40) % 360;
  ctx.save(); ctx.shadowColor = `hsl(${hue},90%,60%)`; ctx.shadowBlur = 50; rr(520, 1100, 520, 10, 5, `hsl(${hue},90%,60%)`); ctx.restore();
  lampGlow(780, 900, 520, '120,140,255', .35);
  // desk + PC
  rr(500, 1110, 560, 34, 8, '#2a2a35', OL, 6);
  rr(560, 850, 360, 230, 14, '#0d0f16', OL, 7);
  const sg = ctx.createLinearGradient(0, 866, 0, 1064); sg.addColorStop(0, '#2b1f5c'); sg.addColorStop(1, '#4b2c84');
  rr(574, 864, 332, 200, 8, sg);
  rr(590, 880, 120, 40, 10, '#e5484d'); txt('LIVE', 650, 902, 26, '#fff', { w: 900 });
  rr(720, 1080, 40, 30, 4, '#0d0f16', OL, 4);
  rr(950, 900, 70, 210, 10, '#11131d', OL, 6);
  ctx.save(); ctx.shadowColor = `hsl(${(hue + 120) % 360},90%,60%)`; ctx.shadowBlur = 24; circ(985, 960, 16, `hsl(${(hue + 120) % 360},90%,60%)`); circ(985, 1010, 16, `hsl(${(hue + 200) % 360},90%,60%)`); ctx.restore();
}

/* ================= SCENES ================= */

// 1. Recap 0–6.5
function e1(t) {
  bgDark(t);
  const items = [[.5, 'Даня — конкурент', '#ca8a04'], [2.0, 'Сервис > цена', '#16a34a'], [3.6, '+9 000 · на счету 58 000', '#2563eb']];
  items.forEach(([a, s, c], i) => {
    const k = pop(t, a, .4);
    card(540, 560 + i * 170, 760, 130, k, () => { circ(-310, 0, 30, c, OL, 5); txt(s, 30, 3, 46, OL, { w: 900 }); }, (i - 1) * .02);
  });
  person(Object.assign({}, TIMUR, { x: 540, y: lerp(1760, 1420, back(P(t, .4, .9))), s: 1.25, expr: 'smirk', talk: talkAmt('T', t) }), t);
  vignette('rgba(0,0,0,1)', .5);
}
// 1b. About me 6.5–15
function e1b(t) {
  bgNightRoom(t);
  const pk = pop(t, 10.0, .5);
  card(540, 640, 520, 400, pk, () => {
    rr(-230, -180, 460, 300, 10, '#d8c7a8');
    ctx.save(); ctx.beginPath(); ctx.rect(-230, -180, 230, 300); ctx.clip();
    person(Object.assign({}, MAMA, { x: -115, y: 150, s: .62, expr: 'h' }), 1);
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(0, -180); for (let i = 0; i <= 12; i++) ctx.lineTo(i % 2 ? 14 : -4, -180 + i * 25); ctx.lineTo(230, 120); ctx.lineTo(230, -180); ctx.closePath();
    ctx.fillStyle = '#fffdf7'; ctx.fill();
    txt('?', 120, -30, 140, '#c7b9a0', { w: 900 });
    txt('мама и я · 2008', 0, 160, 30, '#7a6a55', { w: 700 });
  }, -.04);
  person(Object.assign({}, TIMUR, { x: 300, y: 1530, s: 1.65, expr: t > 12 ? 'sad' : 'n', turn: .5, lx: .6, talk: talkAmt('T', t) }), t);
  vignette('rgba(0,0,20,1)', .55);
}
// 2. Kitchen 15–36
function e2(t) {
  bgKitchen(t);
  const wk = P(t, 15.3, 17.2);
  let mex = 'worry', maL = POSE.idle, maR = POSE.idle, tear = false;
  if (within(t, 18, 21)) maR = [.5, -1.2];
  if (t >= 29.5) { mex = 'sad'; tear = true; }
  person(Object.assign({}, MAMA, { x: 790, y: 1530, s: 1.71, expr: mex, aL: maL, aR: maR, tear, turn: -.5, lx: -.7, talk: talkAmt('O', t), ph: 2 }), t);
  let ex = 'h';
  if (t > 18) ex = 'n';
  if (within(t, 21, 26)) ex = 's';
  if (within(t, 26, 29.5)) ex = 'angry';
  if (t >= 29.5) ex = 'sad';
  person(Object.assign({}, TIMUR, { x: lerp(-180, 300, eout(wk)), y: 1530, s: 1.71, expr: ex, walk: wk < 1 ? 1 : 0, turn: .5, lx: .7, talk: talkAmt('T', t) }), t);
  if (within(t, 21.5, 26)) personCard(t, 540, 620, 420, 460, Object.assign({}, FATHER, { expr: 'n', tired: false, stubble: false, hairCol: '#2a2420' }), 'Отец', '#6b7280', pop(t, 21.6) * (1 - P(t, 25.7, 26)));
  if (within(t, 30, 35.6)) card(540, 600, 620, 360, pop(t, 30.2) * (1 - P(t, 35.3, 35.6)), () => {
    bottle(-170, 10, 1.1);
    ctx.save(); ctx.translate(90, 0);
    heart(0, -20, 1.6, '#e5484d');
    line([-10, -80, 12, -40, -14, -10, 8, 30], '#fffdf7', 9);
    ctx.restore();
    txt('пил · ругались · ушла', 0, 140, 34, '#7a6a55', { w: 800 });
  }, .03);
  grade('#c9b3a0', .25);
  vignette('rgba(10,5,0,1)', .5);
}
function heart(x, y, s, col = '#ef4444') {
  at(x, y, s, 0, () => {
    ctx.beginPath(); ctx.moveTo(0, 40);
    ctx.bezierCurveTo(-70, -10, -40, -70, 0, -30); ctx.bezierCurveTo(40, -70, 70, -10, 0, 40);
    ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 6; ctx.stroke();
  });
}
// 3. Cafe 36–56
function e3(t) {
  bgCafe(t);
  person(Object.assign({}, FATHER, { x: 790, y: 1550, s: 1.73, expr: within(t, 45, 51) ? 'worry' : 'sad', aR: within(t, 45, 51) ? [.5, -1.3] : POSE.idle, turn: -.55, lx: -.7, talk: talkAmt('F', t), ph: 1 }), t);
  person(Object.assign({}, TIMUR, { x: 290, y: 1550, s: 1.73, expr: t < 41.5 ? 'n' : t < 45 ? 'worry' : 's', turn: .55, lx: .7, talk: talkAmt('T', t) }), t);
  cafeTable();
  if (within(t, 38.5, 41.5)) {
    // "same eyes" close-up comparison
    card(540, 560, 760, 240, pop(t, 38.6) * (1 - P(t, 41.2, 41.5)), () => {
      for (const [x, iris] of [[-190, '#4a2f1d'], [190, '#4a2f1d']]) {
        for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(x + sd * 60, 0, 44, 30, 0, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 5; ctx.stroke(); circ(x + sd * 60, 2, 20, iris); circ(x + sd * 60, 2, 10, '#000'); circ(x + sd * 60 - 6, -6, 5, '#fff'); }
      }
      txt('=', 0, 4, 90, '#e5484d', { w: 900 });
    });
  }
  if (within(t, 45.2, 51)) card(540, 560, 760, 220, pop(t, 46.0) * (1 - P(t, 50.7, 51)), () => {
    txt('ДОЛГ', 0, -55, 44, '#64748b', { w: 900 });
    txt('1 500 000 ₽', 0, 30, 104, '#e5484d', { w: 900 });
  });
  if (within(t, 51.1, 55.9)) card(540, 580, 800, 300, pop(t, 51.2) * (1 - P(t, 55.6, 55.9)), () => {
    txt('у меня', -330, -80, 34, '#64748b', { w: 700, al: 'left' });
    const k = eout(P(t, 51.6, 52.4));
