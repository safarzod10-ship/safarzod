/* ---------- episode props ---------- */
function star5(x, y, r, col = '#fbbf24', stroke = '#d97706') {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r;
    ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
  }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(2, r * .12); ctx.lineJoin = 'round'; ctx.stroke();
}
function bear(x, y, s) {
  at(x, y, s, 0, () => {
    const b = '#b7793f', d = '#8a5a2b', l = '#e6c08c';
    ctx.beginPath(); ctx.ellipse(0, 60, 62, 70, 0, 0, Math.PI * 2); ctx.fillStyle = b; ctx.fill(); ctx.strokeStyle = d; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 70, 34, 40, 0, 0, Math.PI * 2); ctx.fillStyle = l; ctx.fill();
    for (const sd of [-1, 1]) {
      circ(sd * 62, 40, 22, b, d, 5); circ(sd * 40, 122, 26, b, d, 5); circ(sd * 40, 126, 12, l);
      circ(sd * 44, -78, 22, b, d, 5); circ(sd * 44, -78, 11, l);
    }
    circ(0, -40, 56, b, d, 5);
    ctx.beginPath(); ctx.ellipse(0, -24, 24, 18, 0, 0, Math.PI * 2); ctx.fillStyle = l; ctx.fill();
    circ(0, -32, 7, '#3b2416'); circ(-20, -52, 6, '#3b2416'); circ(20, -52, 6, '#3b2416');
    ctx.beginPath(); ctx.arc(0, -24, 9, .2, Math.PI - .2); ctx.strokeStyle = '#3b2416'; ctx.lineWidth = 3; ctx.stroke();
  });
}
// ZUBA RUBA screen inside a phone: tasks → case roulette → balance
function zubaPhone(x, y, s, t, a) {
  at(x, y, s, 0, () => {
    rr(-240, -430, 480, 860, 64, '#111827', OL, 8);
    rr(-222, -412, 444, 824, 50, '#f3efe6');

    // balance chip
    const stars = 13 + 2 * eout(P(t, a + 4.4, a + 5.0));
    rr(100, -390, 100, 46, 23, '#ffb81c');
    star5(126, -367, 13); txt(String(Math.round(stars)), 164, -365, 26, '#111', { w: 900 });
    // task card
    const tk = P(t, a + .3, a + .6);
    if (tk > 0) {
      ctx.save(); ctx.globalAlpha = tk;
      rr(-200, -230, 400, 110, 22, '#fff');
      circ(-150, -175, 30, '#2aabee'); txt('TG', -150, -173, 22, '#fff', { w: 900 });
      txt('Подписаться на канал', -105, -195, 24, '#111', { w: 700, al: 'left' });
      txt('+ кейс', -105, -158, 24, '#d97706', { w: 800, al: 'left' });
      const dk = P(t, a + .9, a + 1.3);
      if (dk > 0) { circ(155, -175, 26, '#22c55e'); check(155, -173, .7, dk, '#fff'); }
      ctx.restore();
    }
    // case roulette
    const rk = P(t, a + 1.4, a + 1.7);
    if (rk > 0) {
      ctx.save(); ctx.globalAlpha = rk;
      txt('Кейс', 0, -70, 32, '#111', { w: 900 });
      const vals = ['0,1', '0,3', '0,5', '0,1', '1', '0,3', '0,1', '0,5', '2', '0,1', '0,3', '1', '0,1'];
      const CW = 130, target = 8;
      const off = eout(P(t, a + 1.7, a + 4.0)) * (target * CW) - 2 * CW;
      vals.forEach((v, i) => {
        const cx = i * CW - off - 2 * CW;
        if (cx < -320 || cx > 320) return;
        const win = i === target && t > a + 4.0;
        rr(cx - 56, -20, 112, 140, 20, win ? '#ffb81c' : '#fff', win ? '#111' : null, 5);
        star5(cx, 22, 26);
        txt(v, cx, 88, 30, win ? '#111' : '#6b6458', { w: 900 });
      });
      ctx.beginPath(); ctx.moveTo(-16, -40); ctx.lineTo(16, -40); ctx.lineTo(0, -18); ctx.closePath(); ctx.fillStyle = '#ffb81c'; ctx.fill();
      if (t > a + 4.1) at(0, 200, pop(t, a + 4.1), 0, () => {
        rr(-150, -36, 300, 72, 36, '#111');
        txt('Выпало +2', -24, 2, 30, '#fff', { w: 800 }); star5(96, 0, 18);
      });
      ctx.restore();
    }
    // gift
    const gk = P(t, a + 8.0, a + 8.3);
    if (gk > 0) {
      ctx.save(); ctx.globalAlpha = gk; rr(-222, -412, 444, 824, 0, '#f3efe6'); ctx.restore();
      txt('Подарок', 0, -300, 40, '#111', { w: 900, a: gk });
      bear(0, -60, 1.25 * pop(t, a + 8.2));
      at(0, 170, pop(t, a + 8.6), 0, () => { rr(-130, -32, 260, 64, 32, '#ffb81c'); star5(-70, 0, 16); txt('15', -30, 2, 30, '#111', { w: 900, al: 'left' }); });
      const sk = P(t, a + 9.4, a + 9.8);
      if (sk > 0) at(0, 270, pop(t, a + 9.4), 0, () => { rr(-190, -40, 380, 80, 40, '#2aabee'); txt('Отправить клиенту', 0, 2, 30, '#fff', { w: 800 }); });
      if (t > a + 10.8) at(0, 270, pop(t, a + 10.8), 0, () => { rr(-190, -40, 380, 80, 40, '#22c55e'); check(-140, 2, .7, 1, '#fff'); txt('Отправлено', 16, 2, 30, '#fff', { w: 800 }); });
    }
    ctx.restore();
  });
}
