<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Будильник на 10 000</title>
<style>
@font-face{font-family:'Rubik';src:url('fonts/Rubik.ttf') format('truetype');font-weight:300 900;}
:root{--bg:#0b0d12;--fg:#f4f6fb;--accent:#ffd23f}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Rubik,Arial,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;gap:10px;padding:8px 16px;box-sizing:border-box}
canvas{height:calc(100vh - 80px);max-width:100%;aspect-ratio:9/16;background:#000;border-radius:14px;cursor:pointer}
#ui{display:flex;gap:10px;align-items:center;width:min(560px,100%)}
#ui button{background:var(--accent);color:#111;border:0;border-radius:10px;font:700 16px Rubik,Arial;padding:8px 14px;cursor:pointer}
#ui input{flex:1;accent-color:var(--accent)}
#time{font:600 14px Rubik,Arial;min-width:92px;text-align:right;opacity:.8}
body.render #ui{display:none}
body.render #wrap{padding:0}
body.render canvas{height:auto;border-radius:0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <button id="play">▶ Play</button>
    <input id="seek" type="range" min="0" max="29.5" step="0.01" value="0">
    <span id="time">0:00 / 0:29</span>
  </div>
</div>
<script src="engine.js"></script>
<script>
'use strict';
// timing is fixed (sound effects are synced), the voice is placed without warping
const NO_WARP = true;
const DUR = 29.5, START_MONEY = 0, HUD_FROM = 999, HUD_PULSE = null, COVER_T = 10.3;
const CUTS = [], MONEY = [];
const SUBS = [
  [2.6, 4.7, 'T', 'Что за звуки…'],
  [7.4, 9.6, 'T', 'Подожди… это мне?!'],
  [15.3, 18.2, 'T', 'Блин… это был сон.'],
  [18.5, 22.2, 'T', 'Пацаны, давайте сделаем так, чтобы он сбылся.'],
  [22.5, 28.5, 'T', 'Подпишитесь — и пусть завтра я проснусь вот так по-настоящему.'],
];
window.AUDIO_OVERLAYS = [{ src: 'out/wake10k_sfx.wav', at: 0, volume: .8 }];
let TL = null;
const FROM = 584, GOAL = 10000, TC = 4.4, TB = 11.0, TR = 12.4, TREAL = 14.0;

/* ---------- TikTok-style captions (white, bold, outlined, no boxes) ---------- */
function capText(text, y, size = 60, maxW = 900) {
  ctx.font = `800 ${size}px ${F}`;
  const words = text.split(' '), lines = [''];
  for (const w of words) { const tl = (lines[lines.length - 1] + ' ' + w).trim(); if (ctx.measureText(tl).width > maxW && lines[lines.length - 1]) lines.push(w); else lines[lines.length - 1] = tl; }
  const lh = size * 1.22, top = y - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => {
    const yy = top + i * lh;
    ctx.save(); ctx.font = `800 ${size}px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3;
    ctx.lineJoin = 'round'; ctx.lineWidth = size * .14; ctx.strokeStyle = '#000'; ctx.strokeText(l, 540, yy);
    ctx.shadowColor = 'transparent'; ctx.fillStyle = '#fff'; ctx.fillText(l, 540, yy);
    ctx.restore();
  });
}
// replaces the engine's subtitle style for this video
function subs(t) {
  const s = SUBS.find(x => t >= x[0] && t < x[1]); if (!s) return;
  const k = eout(P(t, s[0], s[0] + .15)) * (1 - P(t, s[1] - .1, s[1]));
  ctx.save(); ctx.globalAlpha = k; capText(s[3].replace(/\*/g, ''), 1500, 62); ctx.restore();
}

/* ---------- followers ---------- */
function followers(t) {
  if (t < TC) return FROM;
  if (t < TB) { const k = P(t, TC, TB), a = 4.2; return Math.round(FROM + (GOAL - FROM) * (Math.exp(a * k) - 1) / (Math.exp(a) - 1)); }
  if (t < TR) return GOAL;
  return FROM;
}

/* ---------- lock screen (drawn in 1080x1920 space, then placed in the phone) ---------- */
function glass(x, y, w, h, r = 36, a = .42) {
  rr(x, y, w, h, r, `rgba(30,30,40,${a})`); rr(x, y, w, h, r, 'rgba(255,255,255,.08)'); rr(x, y, w, h, r, null, 'rgba(255,255,255,.18)', 1.5);
}
function appIcon(x, y, s) {
  rr(x - s / 2, y - s / 2, s, s, s * .24, '#0b0b0f');
  for (const [dx, col] of [[-3, '#25f4ee'], [3, '#fe2c55'], [0, '#fff']]) {
    ctx.save(); ctx.translate(dx * s / 70, 0);
    line([x + s * .08, y + s * .16, x + s * .08, y - s * .26], col, s * .09);
    ctx.beginPath(); ctx.arc(x - s * .06, y + s * .17, s * .13, 0, Math.PI * 2); ctx.strokeStyle = col; ctx.lineWidth = s * .08; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + s * .08, y - s * .26); ctx.quadraticCurveTo(x + s * .14, y - s * .1, x + s * .28, y - s * .12); ctx.stroke();
    ctx.restore();
  }
}
function wallpaper(t) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#1d1b4b'); g.addColorStop(.5, '#4a1d5e'); g.addColorStop(1, '#0f2a4a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.filter = 'blur(60px)';
  [[300, 500, 380, '#ff4fa3'], [800, 1100, 420, '#4f7bff'], [400, 1600, 360, '#8b5cf6']].forEach(([x, y, r, c], i) => {
    ctx.globalAlpha = .55; circ(x + Math.sin(t * .4 + i) * 60, y + Math.cos(t * .3 + i) * 50, r, c);
  });
  ctx.restore();
}
function notifCard(y, nick, ago, a) {
  ctx.save(); ctx.globalAlpha *= a;
  glass(50, y, 980, 150, 38);
  appIcon(130, y + 75, 84);
  txt('TikTok', 196, y + 44, 30, 'rgba(255,255,255,.75)', { w: 600, al: 'left' });
  txt(ago, 1000, y + 44, 26, 'rgba(255,255,255,.6)', { w: 500, al: 'right' });
  txt(`@${nick} подписался(-ась) на вас`, 196, y + 96, 34, '#fff', { w: 600, al: 'left' });
  ctx.restore();
}
function lockScreen(t, real) {
  wallpaper(t);
  txt('07:00', 90, 110, 34, '#fff', { w: 600, al: 'left' });
  rr(910, 94, 70, 32, 8, null, '#fff', 3); rr(916, 100, real ? 18 : 46, 20, 4, real ? '#ff453a' : '#fff'); rr(984, 102, 6, 16, 2, '#fff');
  txt('среда, 12 ноября', 540, 270, 44, 'rgba(255,255,255,.9)', { w: 500 });
  txt('07:00', 540, 420, 240, '#fff', { w: 300 });
  // followers widget
  const v = followers(t);
  glass(210, 620, 660, 150, 44, .45);
  appIcon(300, 695, 84);
  txt('подписчики', 370, 662, 30, 'rgba(255,255,255,.7)', { w: 600, al: 'left' });
  txt(fmt(v), 370, 722, 70, v >= GOAL ? '#25f4ee' : '#fff', { w: 900, al: 'left' });
  if (!real && t < TR + .9) {
    const shownT = t < TR ? t : lerp(TR, 0, eio(P(t, TR, TR + .9)));
    const arrived = TL.notifs.filter(nt => nt <= shownT && nt >= 3.6), n = arrived.length;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 800, W, H); ctx.clip();
    for (let j = 0; j < Math.min(5, n); j++) {
      const idx = TL.notifs.indexOf(arrived[n - 1 - j]), nt = TL.notifs[idx];
      const age = shownT - nt, slide = eout(clamp(age / .25));
      notifCard(830 + j * 166 - (1 - slide) * 166, TL.nicks[idx], age < 1 ? 'сейчас' : `${Math.floor(age)} с назад`, (j === 4 ? .4 : 1) * (j === 0 ? slide : 1));
    }
    ctx.restore();
    if (n > 5) at(540, 830 + 5 * 166 + 30, 1, 0, () => { glass(-210, -32, 420, 64, 32, .5); txt(`+${n - 4} уведомлений`, 0, 2, 28, '#fff', { w: 600 }); });
  }
  if (real) {
    at(540, 900, back(P(t, TREAL + .9, TREAL + 1.2)), 0, () => {
      glass(-490, -90, 980, 180, 46, .55);
      circ(-400, 0, 46, '#ff9f0a'); clock(-400, 0, 30, t * 8);
      txt('Будильник', -330, -26, 38, '#fff', { w: 700, al: 'left' });
      txt('07:00 — подъём', -330, 24, 30, 'rgba(255,255,255,.7)', { w: 500, al: 'left' });
      rr(210, -40, 240, 80, 40, '#ff9f0a'); txt('Стоп', 330, 2, 34, '#000', { w: 700 });
    });
    txt('новых уведомлений нет', 540, 1110, 34, 'rgba(255,255,255,.55)', { w: 500 });
  }
  // 10k moment inside the phone
  if (!real && within(t, TB, TR)) {
    ctx.save(); ctx.globalAlpha = (1 - P(t, TB, TB + .35)) * .9; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore();
    const k = P(t, TB, TB + 1.6);
    if (k < 1) for (let i = 0; i < 80; i++) {
      const a = hash(i) * Math.PI * 2, sp = 300 + hash(i + 5) * 900;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(540 + Math.cos(a) * sp * k, 900 + Math.sin(a) * sp * k + 900 * k * k); ctx.rotate(k * 10 + i);
      ctx.fillStyle = ['#fe2c55', '#25f4ee', '#ffd23f', '#fff'][i % 4]; ctx.fillRect(-12, -6, 24, 12); ctx.restore();
    }
    at(540, 1150, back(P(t, TB + .1, TB + .5)), -.04, () => { txt('10 000', 0, 0, 230, '#fff', { w: 900, st: 22, sc: '#fe2c55' }); txt('подписчиков', 0, 150, 70, '#fff', { w: 800, st: 12 }); });
  }
}

/* ---------- POV: dark bedroom, eyelids, phone in hand ---------- */
function room(t, morning) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, morning ? '#2a3550' : '#0d1222'); g.addColorStop(1, morning ? '#141a2c' : '#05070e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // light through the blinds on the ceiling
  ctx.save(); ctx.globalAlpha = morning ? .35 : .18; ctx.filter = 'blur(18px)';
  for (let i = 0; i < 6; i++) {
    ctx.beginPath(); const x = 120 + i * 150;
    ctx.moveTo(x, -50); ctx.lineTo(x + 70, -50); ctx.lineTo(x + 330, 1100); ctx.lineTo(x + 260, 1100); ctx.closePath();
    ctx.fillStyle = morning ? '#ffd9a8' : '#9fb4ff'; ctx.fill();
  }
  ctx.restore();
  // ceiling lamp
  ctx.save(); ctx.globalAlpha = .6; circ(540, 220, 90, '#1b2238'); circ(540, 220, 70, '#232c48'); ctx.restore();
  // blanket at the bottom
  ctx.save(); const bg = ctx.createLinearGradient(0, 1500, 0, H); bg.addColorStop(0, '#1d2236'); bg.addColorStop(1, '#0c0f1a');
  ctx.beginPath(); ctx.moveTo(0, 1600); ctx.bezierCurveTo(300, 1500, 700, 1560, W, 1480); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 6; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(100 + i * 230, 1650 + i * 20); ctx.quadraticCurveTo(200 + i * 230, 1700, 160 + i * 230, 1900); ctx.stroke(); }
  ctx.restore();
}
function eyelids(open) {
  if (open >= .999) return;
  const gap = open * H * .62;
  ctx.save(); ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.moveTo(-50, -50); ctx.lineTo(W + 50, -50); ctx.lineTo(W + 50, H / 2 - gap); ctx.quadraticCurveTo(540, H / 2 - gap + 260 * (1 - open) + 120, -50, H / 2 - gap); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-50, H + 50); ctx.lineTo(W + 50, H + 50); ctx.lineTo(W + 50, H / 2 + gap); ctx.quadraticCurveTo(540, H / 2 + gap - 260 * (1 - open) - 120, -50, H / 2 + gap); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function phoneInHand(t, y, tilt, real) {
  const PW = 800, PH = 1420, sc = (PW - 40) / W;
  ctx.save(); ctx.translate(540, y); ctx.rotate(tilt);
  // glow on the room
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; const lg = ctx.createRadialGradient(0, 0, 100, 0, 0, 1100); lg.addColorStop(0, 'rgba(120,110,255,.18)'); lg.addColorStop(1, 'rgba(120,110,255,0)'); ctx.fillStyle = lg; ctx.fillRect(-1200, -1300, 2400, 2600); ctx.restore();
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30; rr(-PW / 2, -PH / 2, PW, PH, 96, '#0b0c10'); ctx.restore();
  rr(-PW / 2, -PH / 2, PW, PH, 96, null, '#3a3f4b', 5);
  ctx.save(); ctx.beginPath(); ctx.roundRect(-PW / 2 + 20, -PH / 2 + 20, PW - 40, PH - 40, 78); ctx.clip();
  ctx.translate(-PW / 2 + 20, -PH / 2 + 20 + ((PH - 40) - H * sc) / 2); ctx.scale(sc, sc);
  lockScreen(t, real);
  ctx.restore();
  rr(-80, -PH / 2 + 34, 160, 42, 21, '#000');
  ctx.restore();
}

function scene(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const real = t >= TREAL;
  // eyes: dream wake-up, then closing after the rewind, then the real wake-up
  let open = 0;
  if (t < TREAL) {
    open = Math.max(0, .35 * Math.sin(clamp((t - 1.8) / .6) * Math.PI)) + eout(P(t, 2.6, 3.4));
    open = Math.min(1, open) * (1 - eio(P(t, 13.0, 13.4)));
  } else open = eout(P(t, 14.3, 15.0)) * (1 - P(t, 29.0, 29.5));
  const blur = real ? 8 * (1 - P(t, 14.3, 15.4)) : 14 * (1 - P(t, 2.6, 4.0));
  const shake = within(t, TB, TB + .8) ? 18 * (1 - P(t, TB, TB + .8)) : 0;
  ctx.save(); ctx.translate(Math.sin(t * 90) * shake, Math.cos(t * 70) * shake * .5);
  if (blur > .3) ctx.filter = `blur(${blur}px)`;
  room(t, real);
  // phone
  let py = 2700;
  if (!real) py = lerp(2700, 1010, eout(P(t, 3.6, 4.4))) + eio(P(t, 12.6, 13.2)) * 1700;
  else py = lerp(2700, 1010, eout(P(t, 14.8, 15.4)));
  const tilt = .03 * Math.sin(t * .9) + (real ? .02 : 0);
  if (py < 2600) phoneInHand(t, py + Math.sin(t * 1.7) * 8, tilt, real);
  ctx.restore();
  // rewind glitch over everything
  if (within(t, TR, TR + 1.0)) {
    const g = 1 - P(t, TR + .5, TR + 1.0), f = Math.floor(t * 30);
    for (let i = 0; i < 14; i++) {
      const y = hash(f + i) * H, h = 10 + hash(i + f) * 70;
      ctx.save(); ctx.globalAlpha = .6 * g; ctx.drawImage(cv, 0, y, W, h, (hash(i * 7 + f) - .5) * 90, y, W, h); ctx.restore();
    }
    ctx.save(); ctx.globalAlpha = .25 * g; ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = '#fe2c55'; ctx.fillRect(0, 0, W, H); ctx.restore();
    txt('◀◀', 540, 960, 140, `rgba(255,255,255,${g})`, { w: 900 });
  }
  eyelids(open);
  // hook + CTA in TikTok caption style
  if (t < 2.6) { ctx.save(); ctx.globalAlpha = P(t, .2, .5); capText('давайте я проснусь и офигею', 960, 72, 820); ctx.restore(); }
  if (t >= 22.5 && t < 29.2) capText('подпишись — пусть сон сбудется', 330, 58, 900);
}
const SCENES = [[0, 29.6, scene]];
fetch('wake10k/timeline.json').then(r => r.json()).then(d => { TL = d; }).then(startPlayer);
</script>
</body>
</html>
